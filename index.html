<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Spin The Wheel</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#080b10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    transition:background .2s;
}

.app{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    margin:5px 0 18px;
    font-size:28px;
}

.card{
    background:#111720;
    padding:15px;
    border-radius:16px;
    margin-bottom:15px;
}

textarea{
    width:100%;
    min-height:150px;
    padding:12px;
    border-radius:12px;
    border:1px solid #333;
    background:#080c12;
    color:#fff;
    font-size:16px;
    resize:vertical;
    outline:none;
}

textarea:focus{
    border-color:#168cff;
}

.button-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

button{
    border:0;
    border-radius:11px;
    padding:13px 8px;
    color:#fff;
    background:#29313d;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

button:disabled{
    opacity:.5;
}

.spin{
    width:100%;
    margin-top:15px;
    background:#16a34a;
    font-size:22px;
    padding:17px;
}

.danger{
    background:#d83b3b;
}

.settings{
    width:100%;
    font-size:16px;
}

.settings-panel{
    display:none;
    margin-top:12px;
}

.settings-panel.show{
    display:block;
}

.setting{
    margin-bottom:16px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.color-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

input[type="color"]{
    width:100%;
    height:42px;
    border:0;
    border-radius:8px;
    background:#222;
}

input[type="range"]{
    width:100%;
}

input[type="file"]{
    width:100%;
    color:#ddd;
    font-size:13px;
}

.check{
    display:flex;
    align-items:center;
    gap:10px;
}

.check input{
    width:20px;
    height:20px;
}

#wheelBox{
    position:relative;
    width:min(92vw,550px);
    aspect-ratio:1;
    margin:auto;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.pointer{
    position:absolute;
    top:-2px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-top:45px solid #ff3b30;
    z-index:5;
    pointer-events:none;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));
}

#result{
    margin-top:15px;
    padding:15px;
    background:#080c12;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    min-height:55px;
    word-break:break-word;
}

.status{
    text-align:center;
    color:#999;
    font-size:12px;
    margin-top:8px;
}

.note{
    color:#999;
    font-size:12px;
    line-height:1.4;
}

hr{
    border:0;
    border-top:1px solid #2a313b;
    margin:18px 0;
}
</style>

<body>

<div class="app">

💾 Save

<button
id="loadSettings"

>
📂 Load

🔄 Reset

<script>

/* =====================================================
   TELEGRAM
===================================================== */

try{

    if(
        window.Telegram &&
        window.Telegram.WebApp
    ){

        Telegram.WebApp.ready();

        Telegram.WebApp.expand();

    }

}catch(error){

    console.log(
        "Telegram WebApp not available"
    );

}


/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
document.getElementById("wheel");

const ctx =
canvas.getContext("2d");

const input =
document.getElementById("listInput");

const spinButton =
document.getElementById("spin");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const pointer =
document.querySelector(".pointer");

const settingsButton =
document.getElementById("settingsButton");

const settingsPanel =
document.getElementById("settingsPanel");


/* =====================================================
   SETTINGS
===================================================== */

let settings = {

    colors:[
        "#ff4757",
        "#3742fa",
        "#2ed573",
        "#ffa502"
    ],

    wheelBackground:
        "#111111",

    pageBackground:
        "#080b10",

    textColor:
        "#ffffff",

    textSize:
        16,

    borderColor:
        "#ffffff",

    borderWidth:
        3,

    pointerColor:
        "#ff3b30",

    pointerSize:
        45,

    sound:
        true,

    volume:
        0.5,

    duration:
        5

};


/* =====================================================
   STATE
===================================================== */

let items = [];

let rotation = 0;

let spinning = false;

let wheelImage = null;

let pointerImage = null;

let audioContext = null;


/* =====================================================
   CANVAS
===================================================== */

function resize(){

    const size =
        Math.min(
            window.innerWidth * .92,
            550
        );

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.floor(size * dpr);

    canvas.height =
        Math.floor(size * dpr);

    canvas.style.width =
        size + "px";

    canvas.style.height =
        size + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();

}

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   READ NAMES
===================================================== */

function readNames(){

    const text =
        input.value.trim();

    if(!text){

        items = [];

        status.textContent =
            "0 names loaded";

        return;

    }

    items =
        text
        .split(/[\n,]+/)
        .map(
            function(name){
                return name.trim();
            }
        )
        .filter(
            function(name){
                return name.length > 0;
            }
        );

    items =
        [...new Set(items)];

    status.textContent =
        items.length +
        " names loaded";

}


/* =====================================================
   SHORT NAME
===================================================== */

function shortName(
    name,
    count
){

    let max = 18;

    if(count > 20)
        max = 13;

    if(count > 30)
        max = 10;

    if(count > 40)
        max = 8;

    if(count > 50)
        max = 7;

    if(count > 70)
        max = 6;

    if(name.length <= max){

        return name;

    }

    return (
        name.substring(
            0,
            max - 1
        ) + "…"
    );

}


/* =====================================================
   DRAW WHEEL
===================================================== */

function draw(){

    const size =
        canvas.clientWidth;

    if(!size){

        return;

    }

    const center =
        size / 2;

    const radius =
        size / 2 - 8;


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    /* EMPTY */

    if(items.length === 0){

        ctx.beginPath();

        ctx.arc(
            center,
            center,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            settings.wheelBackground;

        ctx.fill();

        ctx.strokeStyle =
            settings.borderColor;

        ctx.lineWidth =
            settings.borderWidth;

        ctx.stroke();

        ctx.fillStyle =
            settings.textColor;

        ctx.font =
            "bold 18px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "Add names",
            center,
            center
        );

        return;

    }


    const slice =
        Math.PI * 2 /
        items.length;


    /*
       Clip the wheel circle
    */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
    );

    ctx.clip();


    /*
       Wheel background
    */

    ctx.fillStyle =
        settings.wheelBackground;

    ctx.fill();


    /*
       Background image
    */

    if(wheelImage){

        ctx.drawImage(
            wheelImage,
            center - radius,
            center - radius,
            radius * 2,
            radius * 2
        );

    }


    /*
       Segments
    */

    for(
        let i = 0;
        i < items.length;
        i++
    ){

        const start =
            -Math.PI / 2 +
            rotation +
            i * slice;

        const end =
            start + slice;


        ctx.beginPath();

        ctx.moveTo(
            center,
            center
        );

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();


        /*
           If no background image,
           use normal colors.

           If image exists, use a
           transparent tint so image
           remains visible.
        */

        if(wheelImage){

            ctx.fillStyle =
                hexToRGBA(
                    settings.colors[
                        i %
                        settings.colors.length
                    ],
                    0.28
                );

        }
        else{

            ctx.fillStyle =
                settings.colors[
                    i %
                    settings.colors.length
                ];

        }

        ctx.fill();


        /*
           Segment border
        */

        ctx.strokeStyle =
            settings.borderColor;

        ctx.lineWidth =
            settings.borderWidth;

        ctx.stroke();


        /*
           Text
        */

        const middle =
            start +
            slice / 2;

        const textRadius =
            radius * .66;

        const x =
            center +
            Math.cos(middle) *
            textRadius;

        const y =
            center +
            Math.sin(middle) *
            textRadius;


        ctx.save();

        ctx.translate(
            x,
            y
        );

        ctx.rotate(
            middle +
            Math.PI / 2
        );


        let fontSize =
            settings.textSize;


        if(items.length > 30){

            fontSize =
                Math.min(
                    fontSize,
                    13
                );

        }

        if(items.length > 50){

            fontSize =
                Math.min(
                    fontSize,
                    10
                );

        }

        if(items.length > 70){

            fontSize =
                Math.min(
                    fontSize,
                    9
                );

        }


        ctx.fillStyle =
            settings.textColor;

        ctx.font =
            "bold " +
            fontSize +
            "px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        ctx.fillText(
            shortName(
                items[i],
                items.length
            ),
            0,
            0
        );


        ctx.restore();

    }


    ctx.restore();


    /*
       Outer border
    */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        settings.borderColor;

    ctx.lineWidth =
        settings.borderWidth;

    ctx.stroke();

}


/* =====================================================
   HEX TO RGBA
===================================================== */

function hexToRGBA(
    hex,
    alpha
){

    hex =
        hex.replace(
            "#",
            ""
        );

    if(hex.length === 3){

        hex =
            hex[0]+hex[0]+
            hex[1]+hex[1]+
            hex[2]+hex[2];

    }

    const r =
        parseInt(
            hex.substring(0,2),
            16
        );

    const g =
        parseInt(
            hex.substring(2,4),
            16
        );

    const b =
        parseInt(
            hex.substring(4,6),
            16
        );

    return (
        "rgba(" +
        r + "," +
        g + "," +
        b + "," +
        alpha +
        ")"
    );

}


/* =====================================================
   POINTER
===================================================== */

function updatePointer(){

    pointer.style.borderTopColor =
        settings.pointerColor;


    if(pointerImage){

        pointer.style.width =
            settings.pointerSize +
            "px";

        pointer.style.height =
            settings.pointerSize +
            "px";

        pointer.style.border =
            "none";

        pointer.style.backgroundImage =
            "url('" +
            pointerImage.src +
            "')";

        pointer.style.backgroundSize =
            "contain";

        pointer.style.backgroundRepeat =
            "no-repeat";

        pointer.style.backgroundPosition =
            "center";

    }
    else{

        pointer.style.width =
            "0";

        pointer.style.height =
            "0";

        pointer.style.backgroundImage =
            "none";

        pointer.style.borderLeft =
            (
                settings.pointerSize *
                .49
            ) +
            "px solid transparent";

        pointer.style.borderRight =
            (
                settings.pointerSize *
                .49
            ) +
            "px solid transparent";

        pointer.style.borderTop =
            settings.pointerSize +
            "px solid " +
            settings.pointerColor;

    }

}


/* =====================================================
   AUDIO
===================================================== */

function getAudio(){

    if(!audioContext){

        const Audio =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!Audio){

            return null;

        }

        audioContext =
            new Audio();

    }

    return audioContext;

}


/* =====================================================
   TICK SOUND
===================================================== */

function tickSound(){

    if(!settings.sound){

        return;

    }

    try{

        const audio =
            getAudio();

        if(!audio){

            return;

        }

        if(audio.state === "suspended"){

            audio.resume();

        }


        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();


        oscillator.type =
            "square";

        oscillator.frequency.value =
            500;


        gain.gain.setValueAtTime(
            settings.volume * .08,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + .04
        );


        oscillator.connect(
            gain
        );

        gain.connect(
            audio.destination
        );


        oscillator.start();

        oscillator.stop(
            audio.currentTime +
            .05
        );

    }
    catch(error){}

}


/* =====================================================
   RESULT SOUND
===================================================== */

function resultSound(){

    if(!settings.sound){

        return;

    }

    try{

        const audio =
            getAudio();

        if(!audio){

            return;

        }

        if(audio.state === "suspended"){

            audio.resume();

        }


        const oscillator =
            audio.createOscillator();
