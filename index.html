<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin The Wheel</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#10131a;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:15px;
}

.header{
    text-align:center;
    margin-bottom:15px;
}

.header h1{
    font-size:28px;
    margin-bottom:5px;
}

.header p{
    color:#aeb4c0;
    font-size:13px;
}

.card{
    background:#191e28;
    border:1px solid #2b3240;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
}

.card h2{
    font-size:17px;
    margin-bottom:12px;
}

textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    background:#0e1117;
    color:#fff;
    border:1px solid #343c4b;
    border-radius:12px;
    padding:12px;
    font-size:15px;
    outline:none;
}

textarea:focus{
    border-color:#6d7cff;
}

button{
    border:none;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
}

.small-btn{
    background:#303747;
    padding:10px 14px;
    border-radius:10px;
    margin-top:10px;
}

.small-btn:active{
    transform:scale(.97);
}

.wheel-area{
    position:relative;
    width:min(92vw,500px);
    aspect-ratio:1/1;
    margin:10px auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
}

.pointer{
    position:absolute;
    top:-2px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-top:45px solid #ff3b3b;
    z-index:10;
    filter:drop-shadow(0 3px 3px #000);
}

.pointer.custom{
    width:65px;
    height:65px;
    border:none;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    background-color:transparent;
    filter:drop-shadow(0 3px 3px #000);
}

.spin-button{
    display:block;
    width:80%;
    max-width:330px;
    margin:0 auto 15px;
    padding:17px;
    border-radius:50px;
    background:linear-gradient(135deg,#6c5ce7,#3f8cff);
    font-size:22px;
    box-shadow:0 8px 25px rgba(63,140,255,.25);
}

.spin-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.spin-button:active{
    transform:scale(.97);
}

.result{
    text-align:center;
    min-height:55px;
    padding:15px;
    background:#10141c;
    border-radius:13px;
    margin-top:10px;
}

.result-label{
    color:#9299a7;
    font-size:12px;
    margin-bottom:5px;
}

.result-value{
    font-size:22px;
    font-weight:bold;
    word-break:break-word;
}

.settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.setting{
    background:#11151d;
    border-radius:12px;
    padding:10px;
}

.setting label{
    display:block;
    font-size:12px;
    color:#aeb4c0;
    margin-bottom:6px;
}

input[type="color"],
input[type="range"],
input[type="file"]{
    width:100%;
}

input[type="color"]{
    height:42px;
    border:none;
    background:transparent;
    padding:0;
}

input[type="range"]{
    accent-color:#6d7cff;
}

.file-label{
    display:block;
    background:#303747;
    border-radius:9px;
    padding:10px;
    text-align:center;
    font-size:13px;
    cursor:pointer;
}

.file-label input{
    display:none;
}

.toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#11151d;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
}

.toggle{
    width:48px;
    height:26px;
    background:#414958;
    border-radius:20px;
    position:relative;
    cursor:pointer;
}

.toggle::after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#fff;
    top:3px;
    left:4px;
    transition:.2s;
}

.toggle.active{
    background:#6174ff;
}

.toggle.active::after{
    left:24px;
}

.value{
    color:#fff;
    font-weight:bold;
    font-size:13px;
}

.footer{
    text-align:center;
    color:#697181;
    font-size:11px;
    padding:10px;
}

@media(max-width:420px){
    .settings-grid{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🎡 Spin The Wheel</h1>
        <p>Enter anything and let the wheel decide.</p>
    </div>

    <div class="card">
        <h2>Items</h2>

        <textarea id="itemsInput" placeholder="Enter one item per line

Spider-Man
Thor
Hulk
Iron Man
Batman"></textarea>

        <button class="small-btn" onclick="updateWheel()">🔄 Update Wheel</button>
    </div>

    <div class="card">

        <div class="wheel-area" id="wheelArea">

            <canvas id="wheelCanvas" width="800" height="800"></canvas>

            <div id="pointer" class="pointer"></div>

        </div>

        <button id="spinButton" class="spin-button" onclick="spinWheel()">
            🎯 SPIN
        </button>

        <div class="result">
            <div class="result-label">SELECTED RESULT</div>
            <div id="resultValue" class="result-value">
                Ready!
            </div>
        </div>

    </div>

    <div class="card">

        <h2>🎨 Wheel Settings</h2>

        <div class="settings-grid">

            <div class="setting">
                <label>Color 1</label>
                <input type="color" id="color1" value="#6c5ce7">
            </div>

            <div class="setting">
                <label>Color 2</label>
                <input type="color" id="color2" value="#0984e3">
            </div>

            <div class="setting">
                <label>Color 3</label>
                <input type="color" id="color3" value="#00b894">
            </div>

            <div class="setting">
                <label>Color 4</label>
                <input type="color" id="color4" value="#fdcb6e">
            </div>

            <div class="setting">
                <label>Text Color</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>

            <div class="setting">
                <label>Border Color</label>
                <input type="color" id="borderColor" value="#ffffff">
            </div>

        </div>

        <div class="setting" style="margin-top:10px;">
            <label>
                Text Size:
                <span id="textSizeValue" class="value">22px</span>
            </label>
            <input type="range" id="textSize" min="10" max="40" value="22">
        </div>

        <div class="setting" style="margin-top:10px;">
            <label>
                Border Width:
                <span id="borderWidthValue" class="value">5px</span>
            </label>
            <input type="range" id="borderWidth" min="0" max="20" value="5">
        </div>

    </div>

    <div class="card">

        <h2>🖼️ Background</h2>

        <div class="settings-grid">

            <div class="setting">
                <label>Background Color</label>
                <input type="color" id="backgroundColor" value="#10131a">
            </div>

            <div class="setting">
                <label>Wheel Background</label>
                <input type="color" id="wheelBackground" value="#191e28">
            </div>

        </div>

        <label class="file-label" style="margin-top:10px;">
            🖼️ Upload Wheel Background Image
            <input type="file" id="wheelBgFile" accept="image/*">
        </label>

        <button class="small-btn" onclick="removeWheelBackground()">
            Remove Background Image
        </button>

    </div>

    <div class="card">

        <h2>👉 Pointer</h2>

        <div class="settings-grid">

            <div class="setting">
                <label>Pointer Color</label>
                <input type="color" id="pointerColor" value="#ff3b3b">
            </div>

            <div class="setting">
                <label>
                    Pointer Size:
                    <span id="pointerSizeValue" class="value">45px</span>
                </label>
                <input type="range" id="pointerSize" min="25" max="90" value="45">
            </div>

        </div>

        <label class="file-label" style="margin-top:10px;">
            🖼️ Upload Custom Pointer
            <input type="file" id="pointerFile" accept="image/*">
        </label>

        <button class="small-btn" onclick="removeCustomPointer()">
            Use Normal Pointer
        </button>

    </div>

    <div class="card">

        <h2>🔊 Sound & Spin</h2>

        <div class="toggle-row">
            <span>Sound</span>
            <div id="soundToggle" class="toggle active" onclick="toggleSound()"></div>
        </div>

        <div class="setting" style="margin-top:10px;">
            <label>
                Volume:
                <span id="volumeValue" class="value">60%</span>
            </label>
            <input type="range" id="volume" min="0" max="100" value="60">
        </div>

        <div class="setting" style="margin-top:10px;">
            <label>
                Spin Duration:
                <span id="durationValue" class="value">6 seconds</span>
            </label>
            <input type="range" id="duration" min="2" max="15" value="6">
        </div>

    </div>

    <div class="card">

        <h2>💾 Wheel Data</h2>

        <button class="small-btn" onclick="saveSettings()">
            💾 Save Wheel
        </button>

        <button class="small-btn" onclick="loadSettings()">
            📂 Load Saved Wheel
        </button>

        <button class="small-btn" onclick="resetSettings()">
            ♻️ Reset Settings
        </button>

    </div>

    <div class="footer">
        Spin The Wheel • Telegram Mini App
    </div>

</div>

<script>

/* ==========================================
   TELEGRAM MINI APP
========================================== */

if(window.Telegram && window.Telegram.WebApp){

    window.Telegram.WebApp.ready();

    window.Telegram.WebApp.expand();

}


/* ==========================================
   BASIC VARIABLES
========================================== */

const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");

const pointer = document.getElementById("pointer");

const resultValue = document.getElementById("resultValue");

const spinButton = document.getElementById("spinButton");

let items = [
    "Spider-Man",
    "Thor",
    "Hulk",
    "Iron Man"
];

let rotation = 0;

let spinning = false;

let soundEnabled = true;

let wheelBackgroundImage = null;

let customPointerImage = null;


/* ==========================================
   INPUT ELEMENTS
========================================== */

const itemsInput = document.getElementById("itemsInput");

const color1 = document.getElementById("color1");
const color2 = document.getElementById("color2");
const color3 = document.getElementById("color3");
const color4 = document.getElementById("color4");

const textColor = document.getElementById("textColor");

const borderColor = document.getElementById("borderColor");

const backgroundColor = document.getElementById("backgroundColor");

const wheelBackground = document.getElementById("wheelBackground");

const textSize = document.getElementById("textSize");

const borderWidth = document.getElementById("borderWidth");

const pointerColor = document.getElementById("pointerColor");

const pointerSize = document.getElementById("pointerSize");

const volume = document.getElementById("volume");

const duration = document.getElementById("duration");


itemsInput.value = items.join("\n");


/* ==========================================
   WEB AUDIO
========================================== */

let audioContext = null;

function getAudio(){

    if(!audioContext){

        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    return audioContext;

}


function beep(frequency, length){

    if(!soundEnabled) return;

    const audio = getAudio();

    const oscillator = audio.createOscillator();

    const gain = audio.createGain();

    oscillator.frequency.value = frequency;

    oscillator.type = "square";

    gain.gain.value = (Number(volume.value) / 100) * 0.08;

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + length
    );

    oscillator.stop(audio.currentTime + length);

}


/* ==========================================
   SOUND TOGGLE
========================================== */

function toggleSound(){

    soundEnabled = !soundEnabled;

    const toggle = document.getElementById("soundToggle");

    if(soundEnabled){

        toggle.classList.add("active");

    }else{

        toggle.classList.remove("active");

    }

}


/* ==========================================
   UPDATE WHEEL
========================================== */

function updateWheel(){

    const text = itemsInput.value.trim();

    if(!text){

        alert("Please enter at least one item.");

        return;

    }

    items = text
        .split(/[\n,]+/)
        .map(x => x.trim())
        .filter(x => x.length > 0);

    if(items.length === 0){

        alert("Please enter some items.");

        return;

    }

    if(items.length > 100){

        items = items.slice(0,100);

        itemsInput.value = items.join("\n");

        alert("Maximum 100 items allowed.");

    }

    drawWheel();

    resultValue.textContent = "Ready!";

}


/* ==========================================
   DRAW WHEEL
========================================== */

function drawWheel(){

    const size = canvas.width;

    const center = size / 2;

    const radius = size / 2 - 12;

    ctx.clearRect(0,0,size,size);

    /* Wheel background */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
    );

    ctx.clip();

    if(wheelBackgroundImage){

        ctx.drawImage(
            wheelBackgroundImage,
            0,
            0,
            size,
            size
        );

    }else{

        ctx.fillStyle = wheelBackground.value;

        ctx.fillRect(
            0,
            0,
            size,
            size
        );

    }

    const angle = (Math.PI * 2) / items.length;

    const colors = [
        color1.value,
        color2.value,
        color3.value,
        color4.value
    ];

    for(let i = 0; i < items.length; i++){

        const start = rotation + i * angle;

        const end = start + angle;

        ctx.beginPath();

        ctx.moveTo(center,center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle = colors[i % colors.length];

        ctx.fill();

        ctx.strokeStyle = borderColor.value;

        ctx.lineWidth = Number(borderWidth.value);

        ctx.stroke();

    }

    /* Text */

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.fillStyle = textColor.value;

    ctx.font = "bold " + Number(textSize.value) + "px Arial";

    for(let i = 0; i < items.length; i++){

        const start = rotation + i * angle;

        const middle = start + angle / 2;

        const textRadius = radius * 0.65;

        const x =
            center +
            Math.cos(middle) * textRadius;

        const y =
            center +
            Math.sin(middle) * textRadius;

        let text = items[i];

        const maxCharacters =
            items.length > 30 ? 10 :
            items.length > 15 ? 14 :
            20;

        if(text.length > maxCharacters){

            text =
                text.substring(0,maxCharacters - 1)
                + "…";

        }

        ctx.save();

        ctx.translate(x,y);

        ctx.rotate(middle + Math.PI / 2);

        ctx.fillText(text,0,0);

        ctx.restore();

    }

    ctx.restore();

    /* Outer border */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = borderColor.value;

    ctx.lineWidth = Number(borderWidth.value) + 3;

    ctx.stroke();

}


/* ==========================================
   SPIN
========================================== */

function spinWheel(){

    if(spinning) return;

    if(items.length < 1){

        alert("Add some items first.");

        return;

    }

    spinning = true;

    spinButton.disabled = true;

    resultValue.textContent = "Spinning...";

    getAudio();

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }

    const selectedIndex =
        Math.floor(Math.random() * items.length);

    const segmentAngle =
        (Math.PI * 2) / items.length;

    /*
       Pointer is at the top.

       We calculate the exact rotation needed
       to place the selected segment under it.
    */

    const targetMiddle =
        selectedIndex * segmentAngle +
        segmentAngle / 2;

    const pointerAngle =
        -Math.PI / 2;

    let targetRotation =
        pointerAngle -
        targetMiddle;

    targetRotation += Math.PI * 2 * 8;

    while(targetRotation < rotation){

        targetRotation += Math.PI * 2;

    }

    const startRotation = rotation;

    const totalRotation =
        targetRotation - startRotation;

    const spinDuration =
        Number(duration.value) * 1000;

    const startTime = performance.now();

    let lastTick = 0;

    function animate(now){

        const elapsed = now - startTime;

        let progress =
            Math.min(elapsed / spinDuration,1);

        /*
           Smooth ease-out.
        */

        const eased =
            1 - Math.pow(1 - progress,4);

        rotation =
            startRotation +
            totalRotation * eased;

        drawWheel();

        /*
           Tick frequency follows wheel speed.
        */

        const tickPosition =
            Math.floor(rotation / segmentAngle);

        if(tickPosition !== lastTick){

            lastTick = tickPosition;

            const speedFactor =
                1 - progress;

            beep(
                150 + speedFactor * 180,
                0.025
            );

        }

        if(progress < 1){

            requestAnimationFrame(animate);

        }else{

            rotation = targetRotation;

            drawWheel();

            beep(700,0.15);

            resultValue.textContent =
                items[selectedIndex];

            spinning = false;

            spinButton.disabled = false;

        }

    }

    requestAnimationFrame(animate);

}


/* ==========================================
   LIVE SETTINGS
========================================== */

[
    color1,
    color2,
    color3,
    color4,
    textColor,
    borderColor,
    wheelBackground
].forEach(input => {

    input.addEventListener(
        "input",
        drawWheel
    );

});


textSize.addEventListener("input",function(){

    document.getElementById("textSizeValue").textContent =
        this.value + "px";

    drawWheel();

});


borderWidth.addEventListener("input",function(){

    document.getElementById("borderWidthValue").textContent =
        this.value + "px";

    drawWheel();

});


pointerColor.addEventListener("input",function(){

    updatePointer();

});


pointerSize.addEventListener("input",function(){

    document.getElementById("pointerSizeValue").textContent =
        this.value + "px";

    updatePointer();

});


volume.addEventListener("input",function(){

    document.getElementById("volumeValue").textCont
