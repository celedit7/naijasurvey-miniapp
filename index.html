<html lang="en">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080a0f;
    color:#fff;
    transition:background .2s ease;
}

.container{
    width:100%;
    max-width:620px;
    margin:auto;
    padding:15px;
}

h1{
    text-align:center;
    font-size:30px;
    margin:8px 0 5px;
}

.subtitle{
    text-align:center;
    color:#999;
    font-size:14px;
    margin-bottom:18px;
}

.card{
    background:#11151c;
    border:1px solid #252b35;
    border-radius:16px;
    padding:15px;
    margin-bottom:15px;
}

textarea{
    width:100%;
    min-height:135px;
    resize:vertical;
    padding:13px;
    border-radius:12px;
    border:1px solid #303743;
    outline:none;
    background:#090c11;
    color:#fff;
    font-size:14px;
    font-family:Arial,sans-serif;
}

textarea:focus{
    border-color:#666;
}

.button{
    width:100%;
    border:none;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.button:active{
    transform:scale(.98);
}

.action-button{
    background:#292f39;
    color:#fff;
}

.spin-button{
    background:#00d26a;
    color:#000;
    font-size:20px;
    box-shadow:0 5px 20px rgba(0,210,106,.15);
}

.spin-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.settings-button{
    background:#222832;
    color:#fff;
}

.wheel-area{
    position:relative;
    width:min(92vw,540px);
    aspect-ratio:1/1;
    margin:20px auto;
}

#wheelCanvas{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
    transform:rotate(0rad);
    transform-origin:center center;
    will-change:transform;
}

.pointer{
    position:absolute;
    top:-2px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-top:43px solid #ff3b30;
    z-index:20;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.7));
}

.result{
    min-height:32px;
    padding:0 8px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    line-height:1.35;
    word-break:break-word;
}

.settings{
    display:none;
}

.settings.open{
    display:block;
}

.settings h3{
    margin-top:0;
}

.setting-row{
    margin-bottom:16px;
}

.setting-row label{
    display:block;
    color:#ddd;
    font-size:13px;
    margin-bottom:7px;
}

.value{
    float:right;
    color:#999;
}

input[type="color"]{
    width:100%;
    height:42px;
    padding:2px;
    border:none;
    border-radius:8px;
    background:#090c11;
}

input[type="range"]{
    width:100%;
}

input[type="file"]{
    width:100%;
    color:#bbb;
    font-size:12px;
}

select{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid #303743;
    background:#090c11;
    color:#fff;
}

.ad-card{
    overflow:hidden;
}

.ad-title{
    text-align:center;
    color:#777;
    font-size:10px;
    margin-bottom:8px;
}

#nativeAd{
    width:100%;
    min-height:20px;
}

.youtube-support{
    margin:15px auto 0;
    padding:16px;
    max-width:500px;
    border-radius:14px;
    background:#11151c;
    border:1px solid #252b35;
    text-align:center;
}

.youtube-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:6px;
}

.youtube-text{
    color:#aaa;
    font-size:13px;
    margin-bottom:12px;
}

.youtube-button{
    display:block;
    width:100%;
    padding:13px;
    border-radius:11px;
    background:#ff0000;
    color:#fff;
    text-decoration:none;
    font-size:15px;
    font-weight:bold;
}

.small-note{
    text-align:center;
    color:#666;
    font-size:11px;
    margin:14px 0 5px;
}

@media(max-width:400px){

    .container{
        padding:10px;
    }

    h1{
        font-size:26px;
    }

    .wheel-area{
        width:94vw;
    }

    .result{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LIST INPUT -->

Example:
Spider-Man

        <div class="setting-row">
            <label>Wheel Color 2</label>

            >
        </div>

        <div class="setting-row">
            <label>Wheel Color 3</label>
            <input
                type="color"
                id="color3"
                value="#34c759"
            >
        </div>

        <div class="setting-row">
            <label>Wheel Color 4</label>
            <input
                type="color"
                id="color4"
                value="#ffcc00"
            >
        </div>


        <div class="setting-row">
            <label>Wheel Background</label>
            <input
                type="color"
                id="wheelBackground"
                value="#11151c"

        </div>


        <div class="setting-row">
            <label>Page Background</label>
            <input
                type="color"
                id="pageBackground"

        </div>


        <div class="setting-row">

        <div class="setting-row">

            <label>
                Text Size
                <span
                    class="value"

        <div class="setting-row">

                type="range"

        <div class="setting-row">

        <div class="setting-row">

        <div class="setting-row">

        <div class="setting-row">

        <div class="setting-row">

        <button

        <button

    <!-- NATIVE AD -->

    <div class="small-note">

<script>

/* ==========================================
   TELEGRAM
========================================== */

if(
    window.Telegram &&
    window.Telegram.WebApp
){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

}


/* ==========================================
   ELEMENTS
========================================== */

const canvas =
    document.getElementById("wheelCanvas");

const ctx =
    canvas.getContext("2d");

const input =
    document.getElementById("itemsInput");

const result =
    document.getElementById("result");

const spinButton =
    document.getElementById("spinButton");

const pointer =
    document.getElementById("pointer");


/* ==========================================
   VARIABLES
========================================== */

let items = [];

let rotation = 0;

let spinning = false;

let wheelColors = [
    "#ff3b30",
    "#007aff",
    "#34c759",
    "#ffcc00"
];

let wheelBackground =
    "#11151c";

let pageBackground =
    "#080a0f";

let textColor =
    "#ffffff";

let borderColor =
    "#ffffff";

let borderWidth = 3;

let textSize = 14;

let pointerColor =
    "#ff3b30";

let pointerSize = 43;

let soundEnabled = true;

let volume = .5;

let spinDuration = 5;

let wheelImage = null;

let customPointerImage = null;


/* ==========================================
   SETTINGS OPEN/CLOSE
========================================== */

document
.getElementById("settingsButton")
.addEventListener(
    "click",
    function(){

        document
        .getElementById("settingsPanel")
        .classList.toggle("open");

    }
);


/* ==========================================
   PARSE LIST
========================================== */

function parseItems(){

    const text =
        input.value.trim();

    if(!text){

        items = [];

        return;

    }

    items =
        text
        .split(/[\n,]+/)
        .map(function(item){

            return item.trim();

        })
        .filter(function(item){

            return item.length > 0;

        });

}


/* ==========================================
   INPUT CHANGE
========================================== */

input.addEventListener(
    "input",
    function(){

        parseItems();

        drawWheel();

        if(items.length > 0){

            result.textContent =
                items.length +
                " items ready 🎡";

        }else{

            result.textContent =
                "Add items and spin!";

        }

    }
);


/* ==========================================
   SAVE LIST
========================================== */

document
.getElementById("saveListButton")
.addEventListener(
    "click",
    function(){

        parseItems();

        if(items.length === 0){

            alert(
                "There is no list to save."
            );

            return;

        }

        localStorage.setItem(
            "spinWheelList",
            JSON.stringify(items)
        );

        alert(
            "List saved successfully!"
        );

    }
);


/* ==========================================
   LOAD LIST
========================================== */

document
.getElementById("loadListButton")
.addEventListener(
    "click",
    function(){

        const saved =
            localStorage.getItem(
                "spinWheelList"
            );

        if(!saved){

            alert(
                "No saved list found."
            );

            return;

        }


        try{

            const savedItems =
                JSON.parse(saved);


            if(
                !Array.isArray(savedItems) ||
                savedItems.length === 0
            ){

                alert(
                    "Saved list is empty."
                );

                return;

            }


            items =
                savedItems;


            input.value =
                items.join("\n");


            drawWheel();


            result.textContent =
                items.length +
                " items loaded 🎡";


        }catch(error){

            alert(
                "Could not load the saved list."
            );

        }

    }
);


/* ==========================================
   CLEAR LIST
========================================== */

document
.getElementById("clearButton")
.addEventListener(
    "click",
    function(){

        input.value = "";

        items = [];

        result.textContent =
            "Add items and spin!";

        drawWheel();

    }
);


/* ==========================================
   FONT SIZE
========================================== */

function getFontSize(){

    const count =
        items.length;

    if(count <= 10)
        return textSize;

    if(count <= 20)
        return Math.min(textSize,17);

    if(count <= 30)
        return Math.min(textSize,15);

    if(count <= 40)
        return Math.min(textSize,13);

    if(count <= 50)
        return Math.min(textSize,11);

    if(count <= 70)
        return Math.min(textSize,10);

    return Math.min(textSize,9);

}


/* ==========================================
   SHORTEN WHEEL LABEL
========================================== */

function shortenText(text){

    const count =
        items.length;

    let max;

    if(count <= 10)
        max = 18;

    else if(count <= 20)
        max = 14;

    else if(count <= 30)
        max = 11;

    else if(count <= 40)
        max = 9;

    else if(count <= 50)
        max = 8;

    else if(count <= 70)
        max = 7;

    else
        max = 6;


    if(text.length <= max)
        return text;


    return (
        text.substring(0,max - 1) +
        "…"
    );

}


/* ==========================================
   DRAW WHEEL
========================================== */

function drawWheel(){

    const size =
        canvas.width;

    const center =
        size / 2;

    const radius =
        size / 2 - 10;


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    /* Base background */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        wheelBackground;

    ctx.fill();


    /* Empty wheel */

    if(items.length === 0){

        ctx.beginPath();

        ctx.arc(
            center,
            center,
            radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            borderColor;

        ctx.lineWidth =
            borderWidth;

        ctx.stroke();


        ctx.fillStyle =
            textColor;

        ctx.font =
            "bold 30px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "ADD ITEMS",
            center,
            center
        );

        return;

    }


    const slice =
        Math.PI * 2 /
        items.length;


    /* Background image */

    if(wheelImage){

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            center,
            center,
            radius,
            0,
            Math.PI * 2
        );

        ctx.clip();

        ctx.globalAlpha =
            .35;

        ctx.drawImage(
            wheelImage,
            0,
            0,
            size,
            size
        );

        ctx.restore();

    }


    /* Segments */

    for(
        let i = 0;
        i < items.length;
        i++
    ){

        const start =
            -Math.PI / 2 +
            i * slice;

        const end =
            start + slice;


        ctx.beginPath();

        ctx.moveTo(
            center,
            center
