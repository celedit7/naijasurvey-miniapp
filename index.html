<!DOCTYPE html>

<head>

<title>Spin The Wheel</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#10131a;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;
}

.app{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.header{
    text-align:center;
    margin-bottom:15px;
}

.header h1{
    margin:5px 0;
    font-size:30px;
}

.header p{
    margin:5px 0;
    color:#aaa;
    font-size:14px;
}

.card{
    background:#191e27;
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.card-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

textarea{
    width:100%;
    min-height:170px;
    resize:vertical;
    border:1px solid #363d4b;
    border-radius:12px;
    background:#0d1016;
    color:#fff;
    padding:13px;
    font-size:15px;
    outline:none;
}

textarea:focus{
    border-color:#6d7cff;
}

button{
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.main-buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.btn{
    flex:1;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    background:#303746;
    color:#fff;
}

.btn.primary{
    background:#5865f2;
}

.btn.danger{
    background:#c83d4d;
}

.wheel-card{
    text-align:center;
    position:relative;
}

.wheel-wrap{
    width:min(92vw,700px);
    aspect-ratio:1;
    margin:10px auto 20px;
    position:relative;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.pointer{
    position:absolute;
    top:-2px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    width:0;
    height:0;
    border-left:25px solid transparent;
    border-right:25px solid transparent;
    border-top:55px solid #ff3b3b;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
}

.pointer.custom{
    width:70px;
    height:70px;
    border:none;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
}

.spin-btn{
    width:100%;
    max-width:500px;
    padding:18px;
    border-radius:15px;
    background:#5865f2;
    color:#fff;
    font-size:22px;
    margin:auto;
    display:block;
}

.spin-btn:disabled{
    opacity:.5;
}

.result{
    margin-top:15px;
    padding:15px;
    border-radius:13px;
    background:#0d1016;
    min-height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    text-align:center;
}

.settings-section{
    margin-top:10px;
}

.settings-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.setting{
    background:#11151c;
    padding:12px;
    border-radius:12px;
}

.setting.full{
    grid-column:1/-1;
}

.setting label{
    display:block;
    font-size:13px;
    color:#aaa;
    margin-bottom:7px;
}

input[type="color"]{
    width:100%;
    height:42px;
    border:none;
    background:none;
    padding:0;
}

input[type="range"]{
    width:100%;
}

input[type="file"]{
    width:100%;
    color:#aaa;
    font-size:12px;
}

.value{
    float:right;
    color:#fff;
}

.switch{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.switch input{
    width:20px;
    height:20px;
}

.settings-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:12px;
}

.settings-buttons button{
    padding:11px 5px;
    border-radius:10px;
    background:#303746;
    color:#fff;
}

.ad-card{
    text-align:center;
}

.ad-title{
    color:#aaa;
    font-size:12px;
    margin-bottom:8px;
}

#nativeAd{
    width:100%;
    min-height:50px;
    overflow:hidden;
}

@media(max-width:600px){
    .settings-grid{
        grid-template-columns:1fr;
    }

    .settings-buttons{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:25px;
    }

    .pointer{
        border-left-width:19px;
        border-right-width:19px;
        border-top-width:43px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🎡 Spin The Wheel</h1>
        <p>Enter anything and let the wheel choose.</p>
    </div>

    <!-- ITEMS -->
    <div class="card">
        <div class="card-title">📝 Your List</div>

        <textarea id="itemsInput"
        placeholder="Enter one item per line...

Spider-Man
Iron Man
Thor
Hulk
Batman
Superman"></textarea>

        <div class="main-buttons">
            <button class="btn primary" onclick="loadItems()">Load List</button>
            <button class="btn danger" onclick="clearItems()">Clear</button>
        </div>
    </div>

    <!-- WHEEL -->
    <div class="card wheel-card">

        <div class="wheel-wrap">

            <div id="pointer" class="pointer"></div>

            <canvas id="wheel" width="1000" height="1000"></canvas>

        </div>

        <button id="spinButton" class="spin-btn" onclick="spinWheel()">
            🎯 SPIN
        </button>

        <div id="result" class="result">
            Enter your list and spin!
        </div>

    </div>

    <!-- ADS -->
    <div class="card ad-card">



            <div id="container-4b056cbeb341057fc1515bfa7767e1a0"></div>
        </div>

    </div>

    <!-- SETTINGS -->
    <div class="card settings-section">

        <div class="card-title">⚙️ Settings</div>

        <div class="settings-grid">

            <div class="setting">
                <label>Wheel Color 1</label>
                <input type="color" id="color1" value="#5865f2">
            </div>

            <div class="setting">
                <label>Wheel Color 2</label>
                <input type="color" id="color2" value="#ed4245">
            </div>

            <div class="setting">
                <label>Wheel Color 3</label>
                <input type="color" id="color3" value="#57f287">
            </div>

            <div class="setting">
                <label>Wheel Color 4</label>
                <input type="color" id="color4" value="#fee75c">
            </div>

            <div class="setting">
                <label>Wheel Background</label>
                <input type="color" id="wheelBackground" value="#171a21">
            </div>

            <div class="setting">
                <label>Page Background</label>
                <input type="color" id="pageBackground" value="#10131a">
            </div>

            <div class="setting">
                <label>Text Color</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>

            <div class="setting">
                <label>Border Color</label>
                <input type="color" id="borderColor" value="#ffffff">
            </div>

            <div class="setting">
                <label>Text Size <span class="value" id="textSizeValue">20px</span></label>
                <input type="range" id="textSize" min="8" max="40" value="20">
            </div>

            <div class="setting">
                <label>Border Width <span class="value" id="borderWidthValue">3px</span></label>
                <input type="range" id="borderWidth" min="0" max="15" value="3">
            </div>

            <div class="setting">
                <label>Pointer Color</label>
                <input type="color" id="pointerColor" value="#ff3b3b">
            </div>

            <div class="setting">
                <label>Pointer Size <span class="value" id="pointerSizeValue">55px</span></label>
                <input type="range" id="pointerSize" min="30" max="100" value="55">
            </div>

            <div class="setting full">
                <label>Wheel Background Image</label>
                <input type="file" id="wheelImage" accept="image/*">
            </div>

            <div class="setting full">
                <label>Custom Pointer Image</label>
                <input type="file" id="pointerImage" accept="image/*">
            </div>

            <div class="setting">
                <div class="switch">
                    <label>🔊 Sound</label>
                    <input type="checkbox" id="soundEnabled" checked>
                </div>
            </div>

            <div class="setting">
                <label>Volume <span class="value" id="volumeValue">50%</span></label>
                <input type="range" id="volume" min="0" max="100" value="50">
            </div>

            <div class="setting full">
                <label>Spin Duration <span class="value" id="durationValue">5 sec</span></label>
                <input type="range" id="duration" min="2" max="12" value="5">
            </div>

        </div>

        <div class="settings-buttons">
            <button onclick="saveSettings()">💾 Save</button>
            <button onclick="loadSettings()">📂 Load</button>
            <button onclick="resetSettings()">♻️ Reset</button>
        </div>

    </div>

</div>


<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const itemsInput = document.getElementById("itemsInput");
const result = document.getElementById("result");
const spinButton = document.getElementById("spinButton");
const pointer = document.getElementById("pointer");

let items = [];
let rotation = 0;
let spinning = false;

let wheelImage = null;
let pointerImage = null;

let colors = [
    "#5865f2",
    "#ed4245",
    "#57f287",
    "#fee75c"
];

let settings = {
    textSize:20,
    borderWidth:3,
    wheelBackground:"#171a21",
    pageBackground:"#10131a",
    textColor:"#ffffff",
    borderColor:"#ffffff",
    pointerColor:"#ff3b3b",
    pointerSize:55,
    soundEnabled:true,
    volume:50,
    duration:5
};


/* TELEGRAM */

if(window.Telegram && Telegram.WebApp){

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

}


/* INPUT */

function parseItems(){

    let text = itemsInput.value.trim();

    if(!text) return [];

    let list = text
        .split(/[\n,]+/)
        .map(x => x.trim())
        .filter(x => x.length > 0);

    return [...new Set(list)];
}


function loadItems(){

    items = parseItems();

    if(items.length < 2){

        result.textContent = "Enter at least 2 items.";

        return;

    }

    drawWheel();

    result.textContent =
        items.length + " items loaded. Spin the wheel!";

}


function clearItems(){

    itemsInput.value = "";

    items = [];

    result.textContent = "Enter your list and spin!";

    drawWheel();

}


/* TEXT SHORTENING */

/*
This is the important fix for large lists.

The full name stays inside "items".
Only the visual label is shortened.
*/

function visualLabel(text, index){

    let count = items.length;

    let maxChars;

    if(count <= 10){
        maxChars = 18;
    }
    else if(count <= 20){
        maxChars = 14;
    }
    else if(count <= 30){
        maxChars = 11;
    }
    else if(count <= 40){
        maxChars = 9;
    }
    else if(count <= 50){
        maxChars = 8;
    }
    else if(count <= 70){
        maxChars = 7;
    }
    else{
        maxChars = 6;
    }

    if(text.length <= maxChars){
        return text;
    }

    return text.substring(0,maxChars - 1) + "…";
}


/* DYNAMIC FONT */

function getDynamicFontSize(){

    let count = items.length;

    let base = Number(settings.textSize);

    if(count <= 10) return base;

    if(count <= 20) return Math.min(base,17);

    if(count <= 30) return Math.min(base,15);

    if(count <= 40) return Math.min(base,13);

    if(count <= 50) return Math.min(base,11);

    if(count <= 70) return Math.min(base,10);

    return Math.min(base,9);
}


/* DRAW WHEEL */

function drawWheel(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    const radius = Math.min(cx,cy) - 18;

    if(items.length < 2){

        ctx.beginPath();

        ctx.arc(cx,cy,radius,0,Math.PI*2);

        ctx.fillStyle = settings.wheelBackground;

        ctx.fill();

        ctx.strokeStyle = settings.borderColor;

        ctx.lineWidth = settings.borderWidth;

        ctx.stroke();

        ctx.fillStyle = settings.textColor;

        ctx.font = "bold 28px Arial";

        ctx.textAlign = "center";

        ctx.textBaseline = "middle";

        ctx.fillText(
            "Enter your list",
            cx,
            cy
        );

        return;
    }

    const segment = Math.PI * 2 / items.length;

    /*
    Draw background image first.
    */

    ctx.save();

    ctx.beginPath();

    ctx.arc(cx,cy,radius,0,Math.PI*2);

    ctx.clip();

    ctx.fillStyle = settings.wheelBackground;

    ctx.fill();

    if(wheelImage){

        ctx.globalAlpha = 0.35;

        ctx.drawImage(
            wheelImage,
            cx-radius,
            cy-radius,
            radius*2,
            radius*2
        );

        ctx.globalAlpha = 1;

    }

    ctx.restore();


    /*
    Draw segments.
    */

    for(let i=0;i<items.length;i++){

        const start =
            rotation + i * segment;

        const end =
            start + segment;

        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.arc(
            cx,
            cy,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[i % colors.length];

        ctx.fill();

        ctx.strokeStyle =
            settings.borderColor;

        ctx.lineWidth =
            settings.borderWidth;

        ctx.stroke();

    }


    /*
    Draw text.

    Text is rotated to point toward the outside.
    It is also shortened based on list size.
    */

    const fontSize = getDynamicFontSize();

    ctx.fillStyle = settings.textColor;

    ctx.font =
        "bold " +
        fontSize +
        "px Arial";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    for(let i=0;i<items.length;i++){

        const middle =
            rotation +
            i * segment +
            segment / 2;

        const label =
            visualLabel(items[i],i);

        const textRadius =
            radius * 0.68;

        const x =
            cx +
            Math.cos(middle) * textRadius;

        const y =
            cy +
            Math.sin(middle) * textRadius;

        ctx.save();

        ctx.translate(x,y);

        /*
        Keep text readable around the wheel.
        */

        let angle = middle;

        while(angle > Math.PI){
            angle -= Math.PI * 2;
        }

        while(angle < -Math.PI){
            angle += Math.PI * 2;
        }

        if(angle > Math.PI/2 ||
           angle < -Math.PI/2){

            ctx.rotate(angle + Math.PI);

        }else{

            ctx.rotate(angle);

        }

        ctx.fillText(label,0,0);

        ctx.restore();

    }


    /*
    Outer ring.
    */

    ctx.beginPath();

    ctx.arc(cx,cy,radius,0,Math.PI*2);

    ctx.strokeStyle = settings.borderColor;

    ctx.lineWidth =
        Math.max(settings.borderWidth,3);

    ctx.stroke();


    /*
    Center circle.
    */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        Math.max(12, radius * 0.055),
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        settings.borderColor;

    ctx.fill();

}


/* SPIN */

function spinWheel(){

    if(spinning) return;

    items = parseItems();

    if(items.length < 2){

        result.textContent =
            "Enter at least 2 items.";

        return;

    }

    spinning = true;

    spinButton.disabled = true;

    result.textContent = "Spinning... 🎡";


    if(window.AudioContext ||
       window.webkitAudioContext){

        startAudio();

    }


    /*
    Choose the winner BEFORE animation.
    */

    const selectedIndex =
        Math.floor(Math.random() * items.length);

    const segment =
        Math.PI * 2 / items.length;

    /*
    Pointer is at the top.
    Top = -90 degrees.
    */

    const pointerAngle =
        -Math.PI / 2;

    const selectedMiddle =
        selectedIndex * segment +
        segment / 2;

    let targetRotation =
        pointerAngle -
        selectedMiddle;


    /*
    Make the wheel spin forward many times.
    */

    const extraSpins =
        6 + Math.floor(Math.random() * 4);

    while(
        targetRotation <= rotation
    ){

        targetRotation += Math.PI * 2;

    }

    targetRotation +=
        extraSpins * Math.PI * 2;


    const startRotation = rotation;

    const change =
        targetRotation - startRotation;

    const duration =
        Number(settings.duration) * 1000;

    const startTime =
        performance.now();


    function animate(now){

        const elapsed =
            now - startTime;

        let progress =
            Math.min(elapsed / duration,1);


        /*
        Ease out:
        fast at first,
        slow near the end.
        */

        const eased =
            1 - Math.pow(1-progress,4);


        rotation =
            startRotation +
            change * eased;


        drawWheel();

        tickSound(progress);


        if(progress < 1){

            requestAnimationFrame(animate);

        }else{

            rotation =
                targetRotation;

            drawWheel();

            spinning = false;

            spinButton.disabled = false;

            result.textContent =
                "🎉 " + items[selectedIndex];

            landingSound();

        }

    }


    requestAnimationFrame(animate);

}


/* SOUND */

let audioContext = null;

function startAudio(){

    if(!settings.soundEnabled) return;

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioContext.state === "suspended"){

        audioContext.resume();

    }

}


function playTone(
    frequency,
    duration,
    volume
){

    if(!settings.soundEnabled) return;

    if(!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.frequency.value =
        frequency;

    oscillator.type = "square";

    gain.gain.value =
        volume *
        (settings.volume / 100);

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.stop(
        audioContext.currentTime + duration
    );

}


let lastTick = 0;

function tickSound(progress){

    if(!settings.soundEnabled) return;

    const now =
        performance.now();

    /*
    Faster ticks at the beginning,
    slower ticks near the end.
    */

    const interval =
        35 +
        progress * 180;

    if(now - lastTick > interval){

        lastTick = now;

        playTone(
            600,
            0.035,
            0.06
        );

    }

}


function landingSound(){

    playTone(
        900,
        0.12,
        0.12
    );

    setTimeout(
        () => playTone(
            1200,
            0.16,
            0.12
        ),
        100
    );

}
