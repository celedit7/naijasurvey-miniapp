<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Spin The Wheel</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  padding: 18px 12px 40px;
  background: #111827;
  color: #fff;
  font-family: Arial, sans-serif;
}

.app {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

.header {
  text-align: center;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0;
  font-size: 30px;
}

.header p {
  margin: 6px 0 0;
  color: #9ca3af;
  font-size: 14px;
}

.card {
  background: #1f2937;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

textarea {
  width: 100%;
  min-height: 150px;
  padding: 14px;
  border: 1px solid #374151;
  border-radius: 12px;
  outline: none;
  resize: vertical;
  background: #111827;
  color: white;
  font-size: 16px;
  line-height: 1.5;
}

textarea:focus {
  border-color: #22c55e;
}

textarea::placeholder {
  color: #6b7280;
}

.row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

button {
  border: none;
  outline: none;
  min-height: 46px;
  border-radius: 12px;
  padding: 0 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(.97);
}

.btn {
  flex: 1;
  background: #374151;
  color: white;
}

.green {
  background: #22c55e;
  color: white;
}

.red {
  background: #ef4444;
  color: white;
}

.blue {
  background: #3b82f6;
  color: white;
}

.small {
  min-height: 40px;
  font-size: 14px;
}

.counter {
  text-align: center;
  margin-top: 10px;
  color: #9ca3af;
  font-size: 13px;
}

/* WHEEL */

.wheel-container {
  position: relative;
  width: min(100%, 540px);
  margin: auto;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
}

.pointer {
  position: absolute;
  top: -1px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;

  width: 0;
  height: 0;

  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 42px solid #ef4444;

  filter: drop-shadow(0 3px 4px rgba(0,0,0,.5));
}

.spin {
  width: 100%;
  margin-top: 12px;
  min-height: 58px;
  background: #22c55e;
  color: white;
  font-size: 21px;
}

.spin:disabled {
  background: #4b5563;
}

/* CHOOSEONE*/

.CHOOSEONE {
  display: none;
  text-align: center;
  background: #111827;
  border-radius: 14px;
  padding: 17px;
  margin-top: 14px;
}

.CHOOSE {
  display: block;
}

. CHOOSE-label {
  color: #9ca3af;
  font-size: 13px;
  margin-bottom: 5px;
}

#Chosenname {
  font-size: 26px;
  font-weight: bold;
  word-break: break-word;
}

/* SETTINGS */

.setting {
  margin-bottom: 18px;
}

.setting:last-child {
  margin-bottom: 0;
}

.setting label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.color-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.color-box {
  width: 100%;
  height: 45px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 9px;
  overflow: hidden;
}

.color-box input {
  width: 100%;
  height: 100%;
  padding: 0;
  border: none;
  cursor: pointer;
  background: transparent;
}

.single-color {
  width: 100%;
  height: 45px;
  border: none;
  padding: 0;
  border-radius: 9px;
  overflow: hidden;
}

.single-color input {
  width: 100%;
  height: 100%;
  border: none;
  padding: 0;
  background: transparent;
}

.range-value {
  float: right;
  color: #9ca3af;
}

input[type="range"] {
  width: 100%;
  accent-color: #22c55e;
}

.history {
  max-height: 250px;
  overflow-y: auto;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #111827;
  padding: 11px;
  border-radius: 10px;
  margin-bottom: 7px;
}

.history-number {
  color: #6b7280;
  font-size: 13px;
}

.history-name {
  flex: 1;
  font-weight: bold;
  word-break: break-word;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 15px;
}

.notice {
  text-align: center;
  color: #9ca3af;
  font-size: 12px;
  margin-top: 15px;
}

@media (max-width: 400px) {
  .header h1 {
    font-size: 25px;
  }

  .color-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .color-box {
    height: 38px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🎡 Spin The Wheel</h1>
    <p>Enter your items and let the wheel choose</p>
  </div>


  <!-- ITEMS -->

  <div class="card">

    <div class="card-title">📝 Wheel Items</div>

    <textarea id="items"
      placeholder="Enter one item per line

John
David
Michael
Daniel
Samuel"></textarea>

    <div class="row">
      <button type="button" class="btn" id="sampleBtn">
        Load Sample
      </button>

      <button type="button" class="btn red" id="clearBtn">
        Clear
      </button>
    </div>

    <div class="counter">
      Items: <span id="itemCount">0</span>
    </div>

  </div>


  <!-- WHEEL -->

  <div class="card">

    <div class="wheel-container">

      <div class="pointer"></div>

      <canvas id="wheel" width="700" height="700"></canvas>

    </div>

    <button type="button" class="spin" id="spinBtn">
      🎯 SPIN THE WHEEL
    </button>

    <div class="winner" id="winnerBox">

      <div class="winner-label">
        🎉 WINNER
      </div>

      <div id="winnerName"></div>

    </div>

  </div>


  <!-- COLOR SETTINGS -->

  <div class="card">

    <div class="card-title">🎨 Color Settings</div>

    <div class="setting">

      <label>Wheel Colors</label>

      <div class="color-grid">

        <div class="color-box">
          <input type="color" id="color1" value="#ef4444">
        </div>

        <div class="color-box">
          <input type="color" id="color2" value="#3b82f6">
        </div>

        <div class="color-box">
          <input type="color" id="color3" value="#22c55e">
        </div>

        <div class="color-box">
          <input type="color" id="color4" value="#f59e0b">
        </div>

        <div class="color-box">
          <input type="color" id="color5" value="#8b5cf6">
        </div>

        <div class="color-box">
          <input type="color" id="color6" value="#ec4899">
        </div>

        <div class="color-box">
          <input type="color" id="color7" value="#14b8a6">
        </div>

        <div class="color-box">
          <input type="color" id="color8" value="#f97316">
        </div>

        <div class="color-box">
          <input type="color" id="color9" value="#6366f1">
        </div>

        <div class="color-box">
          <input type="color" id="color10" value="#84cc16">
        </div>

      </div>

    </div>


    <div class="setting">

      <label>Wheel Background</label>

      <div class="single-color">
        <input type="color" id="wheelBg" value="#111827">
      </div>

    </div>


    <div class="setting">

      <label>Wheel Border</label>

      <div class="single-color">
        <input type="color" id="borderColor" value="#ffffff">
      </div>

    </div>


    <div class="setting">

      <label>
        Border Width
        <span class="range-value">
          <span id="borderValue">5</span> px
        </span>
      </label>

      <input
        type="range"
        id="borderWidth"
        min="0"
        max="15"
        value="5"
      >

    </div>


    <div class="setting">

      <label>Text Color</label>

      <div class="single-color">
        <input type="color" id="textColor" value="#ffffff">
      </div>

    </div>


    <div class="setting">

      <label>Pointer Color</label>

      <div class="single-color">
        <input type="color" id="pointerColor" value="#ef4444">
      </div>

    </div>


    <button type="button" class="btn blue small" id="resetColors">
      Reset Colors
    </button>

  </div>


  <!-- OTHER SETTINGS -->

  <div class="card">

    <div class="card-title">⚙️ Wheel Settings</div>

    <div class="setting">

      <label>
        Spin Duration
        <span class="range-value">
          <span id="durationValue">4.5</span>s
        </span>
      </label>

      <input
        type="range"
        id="duration"
        min="2"
        max="10"
        step="0.5"
        value="4.5"
      >

    </div>


    <div class="setting">

      <label>
        Text Size
        <span class="range-value">
          <span id="textSizeValue">25</span>
        </span>
      </label>

      <input
        type="range"
        id="textSize"
        min="12"
        max="35"
        value="25"
      >

    </div>

  </div>


  <!-- HISTORY -->

  <div class="card">

    <div class="card-title">🏆 Spin History</div>

    <div class="history" id="history">
      <div class="empty">
        No spins yet
      </div>
    </div>

    <button
      type="button"
      class="btn red small"
      id="clearHistory"
      style="width:100%; margin-top:10px;"
    >
      Clear History
    </button>

  </div>


  <div class="notice">
    Spin The Wheel • ULTRON-S
  </div>

</div>


<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const itemsInput = document.getElementById("items");
const spinBtn = document.getElementById("spinBtn");
const clearBtn = document.getElementById("clearBtn");
const sampleBtn = document.getElementById("sampleBtn");

const itemCount = document.getElementById("itemCount");

const winnerBox = document.getElementById("winnerBox");
const winnerName = document.getElementById("winnerName");

const historyBox = document.getElementById("history");
const clearHistoryBtn = document.getElementById("clearHistory");

let rotation = 0;
let spinning = false;


/* =========================
   SETTINGS
========================= */

let colors = [
  "#ef4444",
  "#3b82f6",
  "#22c55e",
  "#f59e0b",
  "#8b5cf6",
  "#ec4899",
  "#14b8a6",
  "#f97316",
  "#6366f1",
  "#84cc16"
];

let wheelBg = "#111827";
let borderColor = "#ffffff";
let borderWidth = 5;
let textColor = "#ffffff";
let pointerColor = "#ef4444";

let spinDuration = 4.5;
let textSize = 25;

let history = [];


/* =========================
   GET ITEMS
========================= */

function getItems() {

  return itemsInput.value
    .split("\n")
    .map(item => item.trim())
    .filter(item => item !== "");

}


/* =========================
   UPDATE COUNT
========================= */

function updateCount() {

  itemCount.textContent = getItems().length;

}


/* =========================
   DRAW WHEEL
========================= */

function drawWheel() {

  const items = getItems();

  const size = canvas.width;

  const center = size / 2;

  const radius = 325;

  ctx.clearRect(0, 0, size, size);


  /* Empty wheel */

  if (items.length === 0) {

    ctx.beginPath();

    ctx.arc(
      center,
      center,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = wheelBg;
    ctx.fill();

    ctx.lineWidth = borderWidth;
    ctx.strokeStyle = borderColor;
    ctx.stroke();


    ctx.fillStyle = textColor;

    ctx.font = "bold 32px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "Add items",
      center,
      center
    );

    return;
  }


  const slice =
    (Math.PI * 2) / items.length;


  for (let i = 0; i < items.length; i++) {

    const start =
      rotation -
      Math.PI / 2 +
      i * slice;

    const end =
      start + slice;


    ctx.beginPath();

    ctx.moveTo(center, center);

    ctx.arc(
      center,
      center,
      radius,
      start,
      end
    );

    ctx.closePath();

    ctx.fillStyle =
      colors[i % colors.length];

    ctx.fill();


    ctx.lineWidth = borderWidth;

    ctx.strokeStyle = borderColor;

    ctx.stroke();


    /* Text */

    ctx.save();

    ctx.translate(center, center);

    const middle =
      start + slice / 2;

    ctx.rotate(middle);

    ctx.textAlign = "right";

    ctx.textBaseline = "middle";

    let size = textSize;

    if (items.length > 12) {
      size = Math.min(size, 19);
    }

    if (items.length > 20) {
      size = Math.min(size, 14);
    }

    ctx.font =
      "bold " + size + "px Arial";

    ctx.fillStyle = textColor;


    let text = items[i];

    let maxLength = 22;

    if (items.length > 15) {
      maxLength = 15;
    }

    if (text.length > maxLength) {

      text =
        text.substring(0, maxLength - 1)
        + "…";

    }


    ctx.fillText(
      text,
      radius - 24,
      0
    );

    ctx.restore();

  }


  /* Center */

  ctx.beginPath();

  ctx.arc(
    center,
    center,
    58,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = wheelBg;

  ctx.fill();

  ctx.lineWidth = borderWidth;

  ctx.strokeStyle = borderColor;

  ctx.stroke();


  ctx.fillStyle = textColor;

  ctx.font = "bold 19px Arial";

  ctx.textAlign = "center";

  ctx.textBaseline = "middle";

  ctx.fillText(
    "SPIN",
    center,
    center
  );

}


/* =========================
   SPIN
========================= */

function spinWheel() {

  if (spinning) return;


  const items = getItems();


  if (items.length < 2) {

    alert("Please enter at least 2 items.");

    return;

  }


  spinning = true;

  spinBtn.disabled = true;

  winnerBox.classList.remove("show");


  /* Pick winner */

  const winnerIndex =
    Math.floor(
      Math.random() * items.length
    );


  const slice =
    (Math.PI * 2) / items.length;


  /*
    Selected slice center needs
    to end underneath the pointer.
  */

  const desired =
    -(winnerIndex + 0.5) * slice;


  const current =
    rotation % (Math.PI * 2);


  let difference =
    desired - current;


  while (difference < 0) {

    difference += Math.PI * 2;

  }


  const extraSpins =
    5 +
    Math.floor(
      Math.random() * 3
    );


  const startRotation = rotation;


  const finalRotation =
    rotation +
    difference +
    extraSpins *
    Math.PI * 2;


  const duration =
    spinDuration * 1000;


  const startTime =
    performance.now();


  function animate(now) {

    const elapsed =
      now - startTime;


    let progress =
      elapsed / duration;


    if (progress > 1) {
      progress = 1;
    }


    /* Smooth ease out */

    const eased =
      1 -
      Math.pow(
        1 - progress,
        4
      );


    rotation =
      startRotation +
      (finalRotation - startRotation)
      * eased;


    drawWheel();


    if (progress < 1) {

      requestAnimationFrame(animate);

    } else {

      rotation = finalRotation;

      drawWheel();


      const winner =
        items[winnerIndex];


      winnerName.textContent =
        winner;

      winnerBox.classList.add("show");


      addHistory(winner);


      spinning = false;

      spinBtn.disabled = false;

    }

  }


  requestAnimationFrame(animate);

}


/* =========================
   HISTORY
========================= */

function addHistory(name) {

  history.unshift(name);

  if (history.length > 30) {
    history.pop();
  }

  renderHistory();

}


function renderHistory() {

  if (history.length === 0) {

    historyBox.innerHTML =
      '<div class="empty">No spins yet</div>';

    return;

  }


  historyBox.innerHTML =
    history.map(
      (name, index) => `

        <div class="history-item">

          <span class="history-number">
            #${history.length - index}
          </span>

          <span class="history-name">
            ${escapeHtml(name)}
          </span>

        </div>

      `
    ).join("");

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================
   SAMPLE
========================= */

sampleBtn.addEventListener(
  "click",
  function() {

    if (spinning) return;

    itemsInput.value =
`John
David
Michael
Daniel
Samuel
Joshua
Victor
Emmanuel
Christopher
Matthew`;

    updateCount();

    winnerBox.classList.remove("show");

    drawWheel();

  }
);


/* =========================
   CLEAR ITEMS
========================= */

clearBtn.addEventListener(
  "click",
  function() {

    if (spinning) return;

    itemsInput.value = "";

    winnerBox.classList.remove("show");

    rotation = 0;

    updateCount();

    drawWheel();

  }
);


/* =========================
   INPUT
========================= */

itemsInput.addEventListener(
  "input",
  function() {

    if (spinning) return;

    updateCount();

    drawWheel();

  }
);


/* =========================
   SPIN BUTTON
========================= */

spinBtn.addEventListener(
  "click",
  spinWheel
);


/* =========================
   CLEAR HISTORY
========================= */

clearHistoryBtn.addEventListener(
  "click",
  function() {

    history = [];

    renderHistory();

  }
);


/* =========================
   COLOR SETTINGS
========================= */

for (let i = 1; i <= 10; i++) {

  const input =
    document.getElementById(
      "color" + i
    );


  input.addEventListener(
    "input",
    function() {

      colors[i - 1] =
        this.value;

      drawWheel();

    }
  );

}


document
  .getElementById("wheelBg")
  .addEventListener(
    "input",
    function() {

      wheelBg = this.value;

      drawWheel();

    }
  );


document
  .getElementById("borderColor")
  .addEventListener(
    "input",
    function() {

      borderColor = this.value;

      drawWheel();

    }
  );


document
  .getElementById("textColor")
  .addEventListener(
    "input",
    function() {

      textColor = this.value;

      drawWheel();

    }
  );


document
  .getElementById("pointerColor")
  .addEventListener(
    "input",
    function() {

      pointerColor = this.value;

      document.querySelector(
        ".pointer"
      ).style.borderTopColor =
        pointerColor;

    }
  );


/* Border width */

document
  .getElementById("borderWidth")
  .addEventListener(
    "input",
    function() {

      borderWidth =
        Number(this.value);

      document.getElementById(
        "borderValue"
      ).textContent =
        borderWidth;

      drawWheel();

    }
  );


/* Text size */

document
  .getElementById("textSize")
  .addEventListener(
    "input",
    function() {

      textSize =
        Number(this.value);

      document.getElementById(
        "textSizeValue"
      ).textContent =
        textSize;

      drawWheel();

    }
  );


/* Spin duration */

document
  .getElementById("duration")
  .addEventListener(
    "input",
    function() {

      spinDuration =
        Number(this.value);

      document.getElementById(
        "durationValue"
      ).textContent =
        spinDuration;

    }
  );


/* Reset colors */

document
  .getElementById("resetColors")
  .addEventListener(
    "click",
    function() {

      colors = [
        "#ef4444",
        "#3b82f6",
        "#22c55e",
        "#f59e0b",
        "#8b5cf6",
        "#ec4899",
        "#14b8a6",
        "#f97316",
        "#6366f1",
        "#84cc16"
      ];

      wheelBg = "#111827";
      borderColor = "#ffffff";
      borderWidth = 5;
      textColor = "#ffffff";
      pointerColor = "#ef4444";


      for (let i = 1; i <= 10; i++) {

        document.getElementById(
          "color" + i
        ).value =
          colors[i - 1];

      }


      document.getElementById(
        "wheelBg"
      ).value = wheelBg;


      document.getElementById(
        "borderColor"
      ).value = borderColor;


      document.getElementById(
        "textColor"
      ).value = textColor;


      document.getElementById(
        "pointerColor"
      ).value = pointerColor;


      document.getElementById(
        "borderWidth"
      ).value = borderWidth;


      document.getElementById(
        "borderValue"
      ).textContent = borderWidth;


      document.querySelector(
        ".pointer"
      ).style.borderTopColor
