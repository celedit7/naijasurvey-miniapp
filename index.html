<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin The Wheel</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:15px;
    background:#080b10;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    margin:5px 0 18px;
}

.card{
    background:#111720;
    padding:15px;
    border-radius:16px;
    margin-bottom:15px;
}

textarea{
    width:100%;
    min-height:150px;
    padding:12px;
    border-radius:12px;
    border:1px solid #333;
    background:#080c12;
    color:white;
    font-size:16px;
    resize:vertical;
    outline:none;
}

textarea:focus{
    border-color:#168cff;
}

.button-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

button{
    border:0;
    border-radius:11px;
    padding:13px 8px;
    color:white;
    background:#29313d;
    font-weight:bold;
    font-size:14px;
}

button:active{
    transform:scale(.97);
}

.spin{
    width:100%;
    margin-top:15px;
    background:#16a34a;
    font-size:22px;
    padding:17px;
}

.danger{
    background:#d83b3b;
}

.settings{
    width:100%;
    font-size:16px;
}

.settings-panel{
    display:none;
    margin-top:12px;
}

.settings-panel.show{
    display:block;
}

.setting{
    margin-bottom:15px;
}

.setting label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input[type="color"]{
    width:100%;
    height:42px;
    border:0;
    border-radius:8px;
}

input[type="range"]{
    width:100%;
}

#wheelBox{
    position:relative;
    width:min(92vw,550px);
    aspect-ratio:1;
    margin:auto;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.pointer{
    position:absolute;
    top:-2px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-top:45px solid #ff3b30;
    z-index:5;
    pointer-events:none;
}

#result{
    margin-top:15px;
    padding:15px;
    background:#080c12;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    min-height:55px;
    word-break:break-word;
}

.status{
    text-align:center;
    color:#999;
    font-size:12px;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="app">

<h1>🎡 Spin The Wheel</h1>

<div class="card">

<textarea
id="listInput"
placeholder="Enter names here...

Spider-Man
Iron Man
Thor
Hulk
Batman
Superman"
></textarea>

<div class="button-row">

<button id="saveList">
💾 Save
</button>

<button id="loadList">
📂 Load
</button>

<button id="clearList" class="danger">
🗑️ Clear
</button>

</div>

<div id="status" class="status">
0 names loaded
</div>

</div>


<div class="card">

<div id="wheelBox">

<canvas id="wheel"></canvas>

<div class="pointer"></div>

</div>

<button id="spin" class="spin">
🎯 SPIN
</button>

<div id="result">
Add names and spin!
</div>

</div>


<div class="card">

<button id="settingsButton" class="settings">
⚙️ Settings
</button>

<div id="settingsPanel" class="settings-panel">

<div class="setting">
<label>Wheel Color 1</label>
<input type="color" id="c1" value="#ff4757">
</div>

<div class="setting">
<label>Wheel Color 2</label>
<input type="color" id="c2" value="#3742fa">
</div>

<div class="setting">
<label>Wheel Color 3</label>
<input type="color" id="c3" value="#2ed573">
</div>

<div class="setting">
<label>Wheel Color 4</label>
<input type="color" id="c4" value="#ffa502">
</div>

<div class="setting">
<label>Wheel Text Color</label>
<input type="color" id="textColor" value="#ffffff">
</div>

<div class="setting">
<label>Border Color</label>
<input type="color" id="borderColor" value="#ffffff">
</div>

<div class="setting">
<label>Border Width</label>
<input type="range" id="borderWidth" min="0" max="10" value="3">
</div>

<div class="setting">
<label>Text Size</label>
<input type="range" id="textSize" min="8" max="22" value="16">
</div>

<div class="setting">
<label>Pointer Color</label>
<input type="color" id="pointerColor" value="#ff3b30">
</div>

<div class="setting">
<label>Spin Duration</label>
<input type="range" id="duration" min="2" max="10" step=".5" value="5">
</div>

</div>

</div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

if(
    window.Telegram &&
    window.Telegram.WebApp
){

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

}


/* =========================
   ELEMENTS
========================= */

const canvas =
document.getElementById("wheel");

const ctx =
canvas.getContext("2d");

const input =
document.getElementById("listInput");

const spinButton =
document.getElementById("spin");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const settingsButton =
document.getElementById("settingsButton");

const settingsPanel =
document.getElementById("settingsPanel");


/* =========================
   SETTINGS
========================= */

let colors = [
    "#ff4757",
    "#3742fa",
    "#2ed573",
    "#ffa502"
];

let textColor = "#ffffff";

let borderColor = "#ffffff";

let borderWidth = 3;

let textSize = 16;

let pointerColor = "#ff3b30";

let duration = 5;


/* =========================
   STATE
========================= */

let items = [];

let rotation = 0;

let spinning = false;


/* =========================
   CANVAS
========================= */

function resize(){

    const size =
        Math.min(
            window.innerWidth * .92,
            550
        );

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        size * dpr;

    canvas.height =
        size * dpr;

    canvas.style.width =
        size + "px";

    canvas.style.height =
        size + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();

}

window.addEventListener(
    "resize",
    resize
);


/* =========================
   READ NAMES
========================= */

function readNames(){

    const text =
        input.value.trim();

    if(!text){

        items = [];

        status.textContent =
            "0 names loaded";

        return;

    }

    items =
        text
        .split(/[\n,]+/)
        .map(x => x.trim())
        .filter(x => x.length > 0);

    items =
        [...new Set(items)];

    status.textContent =
        items.length +
        " names loaded";

}


/* =========================
   SHORT TEXT
========================= */

function shortName(name,count){

    let max = 18;

    if(count > 20) max = 13;
    if(count > 30) max = 10;
    if(count > 40) max = 8;
    if(count > 50) max = 7;
    if(count > 70) max = 6;

    if(name.length <= max){

        return name;

    }

    return name.substring(0,max-1) + "…";

}


/* =========================
   DRAW
========================= */

function draw(){

    const size =
        canvas.clientWidth;

    if(!size){

        return;

    }

    const center =
        size / 2;

    const radius =
        size / 2 - 8;

    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    /* Empty wheel */

    if(items.length === 0){

        ctx.beginPath();

        ctx.arc(
            center,
            center,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#151b23";

        ctx.fill();

        ctx.strokeStyle =
            borderColor;

        ctx.lineWidth =
            borderWidth;

        ctx.stroke();

        ctx.fillStyle =
            textColor;

        ctx.font =
            "bold 18px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "Add names",
            center,
            center
        );

        return;

    }


    const slice =
        Math.PI * 2 / items.length;


    for(
        let i=0;
        i<items.length;
        i++
    ){

        const start =
            -Math.PI/2 +
            rotation +
            i * slice;

        const end =
            start + slice;


        /* Segment */

        ctx.beginPath();

        ctx.moveTo(
            center,
            center
        );

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[
                i % colors.length
            ];

        ctx.fill();


        /* Border */

        ctx.strokeStyle =
            borderColor;

        ctx.lineWidth =
            borderWidth;

        ctx.stroke();


        /* Text */

        const middle =
            start + slice/2;

        const textRadius =
            radius * .66;

        const x =
            center +
            Math.cos(middle) *
            textRadius;

        const y =
            center +
            Math.sin(middle) *
            textRadius;


        ctx.save();

        ctx.translate(x,y);

        ctx.rotate(
            middle + Math.PI/2
        );

        ctx.fillStyle =
            textColor;

        let font =
            textSize;

        if(items.length > 30)
            font = Math.min(font,13);

        if(items.length > 50)
            font = Math.min(font,10);

        if(items.length > 70)
            font = Math.min(font,9);

        ctx.font =
            "bold " +
            font +
            "px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            shortName(
                items[i],
                items.length
            ),
            0,
            0
        );

        ctx.restore();

    }


    /* Outer border */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        borderColor;

    ctx.lineWidth =
        borderWidth;

    ctx.stroke();

}


/* =========================
   SETTINGS
========================= */

settingsButton.addEventListener(
    "click",
    function(){

        settingsPanel.classList.toggle(
            "show"
        );

    }
);


/* =========================
   LIVE INPUT
========================= */

input.addEventListener(
    "input",
    function(){

        readNames();

        draw();

        result.textContent =
            items.length
            ? items.length + " names ready!"
            : "Add names and spin!";

    }
);


/* =========================
   SAVE
========================= */

document
.getElementById("saveList")
.addEventListener(
    "click",
    function(){

        localStorage.setItem(
            "spinWheelList",
            input.value
        );

        result.textContent =
            "✅ List saved";

    }
);


/* =========================
   LOAD
========================= */

document
.getElementById("loadList")
.addEventListener(
    "click",
    function(){

        const saved =
            localStorage.getItem(
                "spinWheelList"
            );

        if(saved){

            input.value =
                saved;

            readNames();

            draw();

            result.textContent =
                "📂 List loaded";

        }
        else{

            result.textContent =
                "No saved list";

        }

    }
);


/* =========================
   CLEAR
========================= */

document
.getElementById("clearList")
.addEventListener(
    "click",
    function(){

        input.value = "";

        items = [];

        draw();

        status.textContent =
            "0 names loaded";

        result.textContent =
            "Add names and spin!";

    }
);


/* =========================
   SPIN
========================= */

spinButton.addEventListener(
    "click",
    function(){

        if(spinning){

            return;

        }

        readNames();

        if(items.length < 2){

            result.textContent =
                "⚠️ Add at least 2 names.";

            return;

        }


        spinning = true;

        spinButton.disabled =
            true;


        const winner =
            Math.floor(
                Math.random() *
                items.length
            );


        const slice =
            Math.PI * 2 /
            items.length;


        /*
           Pointer is at the TOP.

           Put the center of the
           selected segment exactly
           under the pointer.
        */

        const target =
            -(winner * slice)
            - slice/2;


        const full =
            Math.PI * 2;


        let current =
            rotation % full;


        if(current < 0){

            current += full;

        }


        let difference =
            target - current;


        while(
            difference < 0
        ){

            difference += full;

        }


        const extra =
            6 +
            Math.floor(
                Math.random() * 3
            );


        const finalRotation =
            rotation +
            difference +
            extra * full;


        const startRotation =
            rotation;


        const startTime =
            performance.now();


        const totalTime =
            duration * 1000;


        function animate(now){

            const progress =
                Math.min(
                    (now-startTime) /
                    totalTime,
                    1
                );


            const eased =
                1 -
                Math.pow(
                    1-progress,
                    4
                );


            rotation =
                startRotation +
                (
                    finalRotation -
                    startRotation
                ) * eased;


            draw();


            if(progress < 1){

                requestAnimationFrame(
                    animate
                );

            }
            else{

                rotation =
                    finalRotation;

                draw();


                result.textContent =
                    "🎉 " +
                    items[winner];


                spinning =
                    false;

                spinButton.disabled =
                    false;

            }

        }


        requestAnimationFrame(
            animate
        );

    }
);


/* =========================
   SETTINGS INPUTS
========================= */

document
.getElementById("c1")
.addEventListener(
    "input",
    function(){

        colors[0] =
            this.value;

        draw();

    }
);

document
.getElementById("c2")
.addEventListener(
    "input",
    function(){

        colors[1] =
            this.value;

        draw();

    }
);

document
.getElementById("c3")
.addEventListener(
    "input",
    function(){

        colors[2] =
            this.value;

        draw();

    }
);

document
.getElementById("c4")
.addEventListener(
    "input",
    function(){

        colors[3] =
            this.value;

        draw();

    }
);

document
.getElementById("textColor")
.addEventListener(
    "input",
    function(){

        textColor =
            this.value;

        draw();

    }
);

document
.getElementById("borderColor")
.addEventListener(
    "input",
    function(){

        borderColor =
            this.value;

        draw();

    }
);

document
.getElementById("borderWidth")
.addEventListener(
    "input",
    function(){

        borderWidth =
            Number(this.value);

        draw();

    }
);

document
.getElementById("textSize")
.addEventListener(
    "input",
    function(){

        textSize =
            Number(this.value);

        draw();

    }
);

document
.getElementById("pointerColor")
.addEventListener(
    "input",
    function(){

        pointerColor =
            this.value;

        document
        .querySelector(".pointer")
        .style.borderTopColor =
            pointerColor;

    }
);

document
.getElementById("duration")
.addEventListener(
    "input",
    function(){

        duration =
            Number(this.value);

    }
);


/* =========================
   START
========================= */

document
.querySelector(".pointer")
.style.borderTopColor =
pointerColor;

resize();

readNames();

draw();

</script>

</body>
    </html>
