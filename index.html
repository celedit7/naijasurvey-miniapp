<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin The Wheel</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
    --page-bg:#080a0f;
    --card-bg:#11151c;
    --text:#ffffff;
    --border:#252b35;
    --button:#19c37d;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:var(--page-bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    margin:8px 0 18px;
    font-size:28px;
}

.card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    margin-bottom:15px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    background:#090c11;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    font-size:14px;
    outline:none;
}

textarea:focus{
    border-color:#19c37d;
}

.btn{
    width:100%;
    border:0;
    border-radius:12px;
    padding:13px;
    margin-top:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.load-btn{
    background:#222a35;
    color:white;
}

.clear-btn{
    background:#3a2024;
    color:#ffb8bd;
}

.spin-btn{
    background:var(--button);
    color:#001b11;
    font-size:22px;
    padding:17px;
    box-shadow:0 5px 20px rgba(25,195,125,.2);
}

.spin-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.wheel-wrap{
    position:relative;
    width:100%;
    max-width:650px;
    margin:10px auto;
}

#wheel{
    display:block;
    width:100%;
    height:auto;
    border-radius:50%;
}

/* FIXED POINTER */
.pointer{
    position:absolute;
    top:-3px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;

    /* The colored TOP border makes the triangle
       point DOWN into the wheel */
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-top:42px solid #ff3b30;

    border-bottom:0;

    z-index:10;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
}

.result{
    text-align:center;
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    padding:10px;
    border-radius:12px;
    background:#090c11;
    margin-top:12px;
}

.youtube-support{
    margin:15px auto 0;
    padding:15px;
    max-width:500px;
    border-radius:14px;
    background:#11151c;
    text-align:center;
}

.youtube-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:6px;
}

.youtube-text{
    font-size:13px;
    color:#aaa;
    margin-bottom:12px;
}

.youtube-button{
    display:block;
    width:100%;
    padding:13px;
    border-radius:11px;
    background:#ff0000;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    font-size:15px;
}

.settings-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.settings-content{
    display:none;
    margin-top:15px;
}

.setting{
    margin-bottom:15px;
}

.setting-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

input[type="color"]{
    width:100%;
    height:45px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#090c11;
    padding:3px;
}

input[type="range"]{
    width:100%;
}

input[type="file"]{
    width:100%;
    color:#aaa;
    font-size:12px;
}

.value{
    float:right;
    color:#19c37d;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
}

.checkbox-row input{
    width:18px;
    height:18px;
}

.save-btn{
    background:#19c37d;
    color:#001b11;
}

.reset-btn{
    background:#3a2024;
    color:#ffb8bd;
}

.ad-card{
    text-align:center;
}

.ad-title{
    font-size:10px;
    color:#777;
    margin-bottom:8px;
    letter-spacing:1px;
}

#nativeAd{
    min-height:20px;
}

.small-note{
    color:#777;
    font-size:11px;
    line-height:1.5;
    margin-top:7px;
}

@media(max-width:450px){

    body{
        padding:10px;
    }

    h1{
        font-size:24px;
    }

    .setting-row{
        grid-template-columns:1fr;
    }
}
</style>

<script>

/* =====================================================
   TELEGRAM
===================================================== */

if(
window.Telegram &&
Telegram.WebApp
){

Telegram.WebApp.ready();

Telegram.WebApp.expand();

}


/* =====================================================
   NATIVE AD ROTATION
===================================================== */

function loadNativeAd(){

const box =
document.getElementById("nativeAd");

box.innerHTML = "";

const day =
new Date().getDay();

const script =
document.createElement("script");

script.async = true;

script.setAttribute(
"data-cfasync",
"false"
);


if(day === 0){

/* Sunday = old weekly native */

script.src =
"https://tightslybella.com/4b056cbeb341057fc1515bfa7767e1a0/invoke.js";

const container =
document.createElement("div");

container.id =
"container-4b056cbeb341057fc1515bfa7767e1a0";

box.appendChild(script);

box.appendChild(container);

}else{

/* Monday-Saturday = new native */

script.src =
"https://tightslybella.com/11504f50c898c94d8775abe4b43c5a69/invoke.js";

const container =
document.createElement("div");

container.id =
"container-11504f50c898c94d8775abe4b43c5a69";

box.appendChild(script);

box.appendChild(container);

}

}

loadNativeAd();


/* =====================================================
   VARIABLES
===================================================== */

const canvas =
document.getElementById("wheel");

const ctx =
canvas.getContext("2d");

const itemsInput =
document.getElementById("items");

const spinBtn =
document.getElementById("spinBtn");

const result =
document.getElementById("result");

const pointer =
document.getElementById("pointer");

let items = [];

let rotation = 0;

let spinning = false;

let wheelImage = null;

let pointerImage = null;

let audioContext = null;


/* =====================================================
   SETTINGS
===================================================== */

let settings = {

colors:[
"#ff4757",
"#3742fa",
"#ffa502",
"#2ed573"
],

wheelBg:"#11151c",

pageBg:"#080a0f",

textColor:"#ffffff",

textSize:18,

borderColor:"#ffffff",

borderWidth:6,

pointerColor:"#ff3b30",

pointerSize:42,

volume:50,

duration:5,

soundEnabled:true

};


/* =====================================================
   SETTINGS TOGGLE
===================================================== */

function toggleSettings(){

const content =
document.getElementById(
"settingsContent"
);

const arrow =
document.getElementById(
"settingsArrow"
);

if(
content.style.display ===
"block"
){

content.style.display =
"none";

arrow.textContent =
"▼";

}else{

content.style.display =
"block";

arrow.textContent =
"▲";

}

}


/* =====================================================
   PARSE ITEMS
===================================================== */

function parseItems(){

return itemsInput.value
.split(/[\n,]+/)
.map(x => x.trim())
.filter(x => x.length > 0);

}


/* =====================================================
   LOAD LIST
===================================================== */

function loadList(){

const newItems =
parseItems();

if(newItems.length < 2){

alert(
"Please enter at least 2 items."
);

return;

}

items =
newItems;

rotation = 0;

result.textContent =
items.length +
" items loaded. Spin! 🎯";

drawWheel();

}


/* =====================================================
   CLEAR
===================================================== */

function clearList(){

items = [];

itemsInput.value = "";

rotation = 0;

result.textContent =
"Add items and spin!";

drawWheel();

}


/* =====================================================
   SHORTEN DISPLAY TEXT
===================================================== */

function getVisualText(
text,
count
){

let max;

if(count <= 10){

max = 18;

}else if(count <= 20){

max = 14;

}else if(count <= 30){

max = 11;

}else if(count <= 40){

max = 9;

}else if(count <= 50){

max = 8;

}else if(count <= 70){

max = 7;

}else{

max = 6;

}

if(text.length <= max){

return text;

}

return text.slice(
0,
Math.max(1,max - 1)
) + "…";

}


/* =====================================================
   FONT SIZE
===================================================== */

function getFontSize(count){

if(count <= 10){

return settings.textSize;

}

if(count <= 20){

return Math.min(
settings.textSize,
17
);

}

if(count <= 30){

return Math.min(
settings.textSize,
15
);

}

if(count <= 40){

return Math.min(
settings.textSize,
13
);

}

if(count <= 50){

return Math.min(
settings.textSize,
11
);

}

if(count <= 70){

return Math.min(
settings.textSize,
10
);

}

return Math.min(
settings.textSize,
9
);

}


/* =====================================================
   DRAW WHEEL
===================================================== */

function drawWheel(){

const size =
canvas.width;

const center =
size / 2;

const radius =
center - 20;

ctx.clearRect(
0,
0,
size,
size
);


/* Wheel background */

ctx.beginPath();

ctx.arc(
center,
center,
radius,
0,
Math.PI * 2
);

ctx.fillStyle =
settings.wheelBg;

ctx.fill();


/* Empty wheel */

if(items.length === 0){

ctx.beginPath();

ctx.arc(
center,
center,
radius,
0,
Math.PI * 2
);

ctx.strokeStyle =
settings.borderColor;

ctx.lineWidth =
settings.borderWidth;

ctx.stroke();

ctx.fillStyle =
settings.textColor;

ctx.font =
"bold 40px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.fillText(
"ADD ITEMS",
center,
center
);

return;

}


const slice =
(Math.PI * 2) /
items.length;

const fontSize =
getFontSize(
items.length
);


/*
IMPORTANT:

The first segment starts at
-90 degrees.

That means the TOP of the wheel
is the same reference point as
the fixed pointer.
*/


ctx.save();

ctx.translate(
center,
center
);

ctx.rotate(
rotation
);


for(
let i = 0;
i < items.length;
i++
){

const start =
-Math.PI / 2 +
i * slice;

const end =
start + slice;


/* Segment */

ctx.beginPath();

ctx.moveTo(
0,
0
);

ctx.arc(
0,
0,
radius,
start,
end
);

ctx.closePath();

ctx.fillStyle =
settings.colors[
i %
settings.colors.length
];

ctx.fill();

ctx.strokeStyle =
settings.borderColor;

ctx.lineWidth =
Math.max(
1,
settings.borderWidth / 2
);

ctx.stroke();


/* Text */

const middle =
start +
slice / 2;

const textRadius =
radius * 0.63;

const x =
Math.cos(middle) *
textRadius;

const y =
Math.sin(middle) *
textRadius;


ctx.save();

ctx.translate(
x,
y
);

let textAngle =
middle;

if(
textAngle >
Math.PI / 2 &&
textAngle <
Math.PI * 1.5
){

textAngle +=
Math.PI;

}

ctx.rotate(
textAngle
);

ctx.fillStyle =
settings.textColor;

ctx.font =
"bold " +
fontSize +
"px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.shadowColor =
"rgba(0,0,0,.55)";

ctx.shadowBlur = 3;

ctx.fillText(
getVisualText(
items[i],
items.length
),
0,
0
);

ctx.restore();

}

ctx.restore();


/* Outer border */

ctx.beginPath();

ctx.arc(
center,
center,
radius,
0,
Math.PI * 2
);

ctx.strokeStyle =
settings.borderColor;

ctx.lineWidth =
settings.borderWidth;

ctx.stroke();


/* Wheel image */

if(wheelImage){

ctx.save();

ctx.beginPath();

ctx.arc(
center,
center,
radius,
0,
Math.PI * 2
);

ctx.clip();

ctx.globalAlpha =
0.18;

ctx.drawImage(
wheelImage,
0,
0,
size,
size
);

ctx.restore();

}

}


/* =====================================================
   POINTER
===================================================== */

function updatePointer(){

pointer.style.borderLeft =
(
settings.pointerSize / 2
) +
"px solid transparent";

pointer.style.borderRight =
(
settings.pointerSize / 2
) +
"px solid transparent";


/*
IMPORTANT:

border-top is colored.

This makes the triangle point DOWN
into the wheel.
*/

pointer.style.borderTop =
settings.pointerSize +
"px solid " +
settings.pointerColor;

pointer.style.borderBottom =
"0";


if(pointerImage){

pointer.style.width =
settings.pointerSize +
"px";

pointer.style.height =
settings.pointerSize +
"px";

pointer.style.border =
"none";

pointer.style.background =
"url('" +
pointerImage.src +
"') center/contain no-repeat";

}else{

pointer.style.width =
"0";

pointer.style.height =
"0";

pointer.style.background =
"transparent";

pointer.style.borderLeft =
(
settings.pointerSize / 2
) +
"px solid transparent";

pointer.style.borderRight =
(
settings.pointerSize / 2
) +
"px solid transparent";

pointer.style.borderTop =
settings.pointerSize +
"px solid " +
settings.pointerColor;

pointer.style.borderBottom =
"0";

}

}


/* =====================================================
   AUDIO
===================================================== */

function getAudio(){

if(!audioContext){

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if(
audioContext.state ===
"suspended"
){

audioContext.resume();

}

return audioContext;

}


function playTick(){

if(!settings.soundEnabled){

return;

}

try{

const audio =
getAudio();

const oscillator =
audio.createOscillator();

const gain =
audio.createGain();

oscillator.type =
"square";

oscillator.frequency.value =
850;

gain.gain.value =
(settings.volume / 100) *
0.045;

oscillator.connect(gain);

gain.connect(
audio.destination
);

oscillator.start();

oscillator.stop(
audio.currentTime +
0.025
);

}catch(e){}

}


function playLandingSound(){

if(!settings.soundEnabled){

return;

}

try{

const audio =
getAudio();

const oscillator =
audio.createOscillator();

const gain =
audio.createGain();

oscillator.type =
"sine";

oscillator.frequency.setValueAtTime(
420,
audio.currentTime
);

oscillator.frequency.exponentialRampToValueAtTime(
760,
audio.currentTime + 0.12
);

gain.gain.value =
(settings.volume / 100) *
0.12;

oscillator.connect(gain);

gain.connect(
audio.destination
);

oscillator.start();

oscillator.stop(
audio.currentTime +
0.2
);

}catch(e){}

}


/* =====================================================
   SPIN WHEEL
===================================================== */

function spinWheel(){

if(spinning){

return;

}

if(items.length < 2){

alert(
"Load at least 2 items first."
);

return;

}


spinning = true;

spinBtn.disabled = true;

result.textContent =
"Spinning... 🎡";


if(settings.soundEnabled){

try{

getAudio();

}catch(e){}

}


/*
=========================================================
SELECT WINNER
=========================================================
*/

const winnerIndex =
Math.floor(
Math.random() *
items.length
);

const slice =
(Math.PI * 2) /
items.length;


/*
=========================================================
THE IMPORTANT POINTER CALCULATION
=========================================================

The pointer is at the TOP.

The wheel's first segment starts at:

-Math.PI / 2

So the center of item N is:

-Math.PI / 2
+ N * slice
+ slice / 2
+ rotation

For that item to be directly under
the pointer, its center must equal:

-Math.PI / 2

Therefore:

rotation
=
-(N * slice + slice / 2)

This keeps the result mathematically
locked to the pointer.
=========================================================
*/

const targetRot
