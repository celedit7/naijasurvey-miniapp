<body>

<script>
/* =========================
   TELEGRAM
========================= */

if(window.Telegram && Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}


/* =========================
   VARIABLES
========================= */

const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");

const input = document.getElementById("itemsInput");
const result = document.getElementById("result");
const spinButton = document.getElementById("spinButton");

let items = [];
let rotation = 0;
let spinning = false;

let wheelColors = [
    "#ff3b30",
    "#007aff",
    "#34c759",
    "#ffcc00"
];

let wheelBackground = "#11151c";
let pageBackground = "#080a0f";
let textColor = "#ffffff";
let borderColor = "#ffffff";
let borderWidth = 3;
let textSize = 14;

let pointerColor = "#ff3b30";
let pointerSize = 42;

let wheelImage = null;
let pointerImage = null;

let soundEnabled = true;
let volume = 0.5;
let spinDuration = 5;


/* =========================
   INPUT
========================= */

input.addEventListener("input", function(){
    parseItems();
    drawWheel();
});

function parseItems(){

    const text = input.value.trim();

    if(!text){
        items = [];
        return;
    }

    items = text
        .split(/[\n,]+/)
        .map(x => x.trim())
        .filter(x => x.length > 0);

}


/* =========================
   CLEAR
========================= */

function clearItems(){

    input.value = "";
    items = [];

    result.textContent = "Add some items and spin!";

    drawWheel();
}


/* =========================
   SETTINGS PANEL
========================= */

function toggleSettings(){

    const panel = document.getElementById("settingsPanel");

    panel.classList.toggle("open");
}


/* =========================
   FONT SIZE
========================= */

function getWheelFontSize(){

    const count = items.length;

    if(count <= 10) return textSize;

    if(count <= 20) return Math.min(textSize,17);

    if(count <= 30) return Math.min(textSize,15);

    if(count <= 40) return Math.min(textSize,13);

    if(count <= 50) return Math.min(textSize,11);

    if(count <= 70) return Math.min(textSize,10);

    return Math.min(textSize,9);
}


/* =========================
   LABEL SHORTENER
========================= */

function shortenText(text){

    const count = items.length;

    let max;

    if(count <= 10) max = 18;
    else if(count <= 20) max = 14;
    else if(count <= 30) max = 11;
    else if(count <= 40) max = 9;
    else if(count <= 50) max = 8;
    else if(count <= 70) max = 7;
    else max = 6;

    if(text.length <= max){
        return text;
    }

    return text.substring(0,max - 1) + "…";
}


/* =========================
   DRAW WHEEL
========================= */

function drawWheel(){

    const size = canvas.width;

    ctx.clearRect(0,0,size,size);

    const center = size / 2;
    const radius = size / 2 - 10;

    /* Wheel background */

    ctx.save();

    if(wheelImage){

        ctx.save();

        ctx.beginPath();
        ctx.arc(center,center,radius,0,Math.PI * 2);
        ctx.clip();

        ctx.drawImage(
            wheelImage,
            0,
            0,
            size,
            size
        );

        ctx.restore();

    }else{

        ctx.beginPath();
        ctx.arc(center,center,radius,0,Math.PI * 2);
        ctx.fillStyle = wheelBackground;
        ctx.fill();

    }

    /* Empty wheel */

    if(items.length === 0){

        ctx.beginPath();
        ctx.arc(center,center,radius,0,Math.PI * 2);

        ctx.strokeStyle = borderColor;
        ctx.lineWidth = borderWidth;

        ctx.stroke();

        ctx.fillStyle = textColor;
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            "ADD ITEMS",
            center,
            center
        );

        ctx.restore();
        return;
    }


    const slice = Math.PI * 2 / items.length;

    /* Segments */

    for(let i=0;i<items.length;i++){

        const start = -Math.PI / 2 + i * slice;
        const end = start + slice;

        ctx.beginPath();

        ctx.moveTo(center,center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            wheelColors[i % wheelColors.length];

        ctx.fill();

        ctx.strokeStyle = borderColor;
        ctx.lineWidth = borderWidth;
        ctx.stroke();


        /* Text */

        const middle = start + slice / 2;

        const textRadius =
            radius * (items.length > 40 ? 0.70 : 0.65);

        const x =
            center + Math.cos(middle) * textRadius;

        const y =
            center + Math.sin(middle) * textRadius;

        ctx.save();

        ctx.translate(x,y);

        let angle = middle;

        if(angle > Math.PI / 2 &&
           angle < Math.PI * 1.5){

            angle += Math.PI;
        }

        ctx.rotate(angle);

        ctx.fillStyle = textColor;

        ctx.font =
            "bold " + getWheelFontSize() + "px Arial";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            shortenText(items[i]),
            0,
            0
        );

        ctx.restore();

    }


    /* Outer border */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderWidth + 2;

    ctx.stroke();

    ctx.restore();
}


/* =========================
   SOUND
========================= */

let audioContext = null;

function createAudio(){

    if(!audioContext){

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}


function playTick(){

    if(!soundEnabled) return;

    createAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.value = 600;

    gain.gain.setValueAtTime(
        volume * 0.15,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.04
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.05
    );
}


function playWin(){

    if(!soundEnabled) return;

    createAudio();

    const now = audioContext.currentTime;

    [523,659,784].forEach((freq,index)=>{

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value = freq;

        gain.gain.setValueAtTime(
            volume * 0.25,
            now + index * 0.12
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + index * 0.12 + 0.25
        );

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start(
            now + index * 0.12
        );

        oscillator.stop(
            now + index * 0.12 + 0.27
        );

    });

}


/* =========================
   SPIN
========================= */

function spinWheel(){

    if(spinning) return;

    parseItems();

    if(items.length < 2){

        result.textContent =
            "Enter at least 2 items.";

        return;
    }

    createAudio();

    spinning = true;
    spinButton.disabled = true;

    result.textContent = "Spinning... 🎡";


    /* Pick winner BEFORE animation */

    const winnerIndex =
        Math.floor(
            Math.random() * items.length
        );


    const slice =
        Math.PI * 2 / items.length;


    /*
       Pointer is at the top.

       Segment 0 starts at -PI/2.
       We rotate the wheel so the
       center of winnerIndex reaches
       the pointer.
    */

    const targetRotation =
        -(winnerIndex * slice + slice / 2);


    const fullCircle = Math.PI * 2;

    let currentRotation =
        rotation % fullCircle;

    if(currentRotation < 0){
        currentRotation += fullCircle;
    }


    let delta =
        targetRotation - currentRotation;


    while(delta < 0){
        delta += fullCircle;
    }


    const extraSpins =
        6 + Math.floor(Math.random() * 4);


    const finalRotation =
        rotation +
        delta +
        extraSpins * fullCircle;


    const startRotation = rotation;

    const startTime = performance.now();

    const duration =
        spinDuration * 1000;


    let lastTickTime = 0;


    function animate(now){

        const elapsed =
            now - startTime;

        let progress =
            elapsed / duration;

        if(progress > 1){
            progress = 1;
        }


        /*
           Ease out:
           fast at beginning,
           gradually slows near end.
        */

        const eased =
            1 - Math.pow(1 - progress, 4);


        rotation =
            startRotation +
            (finalRotation - startRotation) *
            eased;


        canvas.style.transform =
            "rotate(" + rotation + "rad)";


        /* Tick sound */

        const tickInterval =
            35 + progress * 180;

        if(
            soundEnabled &&
            now - lastTickTime > tickInterval
        ){

            playTick();

            lastTickTime = now;
        }


        if(progress < 1){

            requestAnimationFrame(animate);

        }else{

            rotation = finalRotation;

            /*
               Keep the rotation number manageable.
            */

            rotation =
                rotation % fullCircle;

            canvas.style.transform =
                "rotate(" + rotation + "rad)";


            result.textContent =
                "🎉 " + items[winnerIndex];

            playWin();

            spinning = false;
            spinButton.disabled = false;
        }

    }


    requestAnimationFrame(animate);
}


/* =========================
   POINTER COLOR
========================= */

function updatePointer(){

    const pointer =
        document.querySelector(".pointer");

    pointer.style.borderTopColor =
        pointerColor;

    pointer.style.borderLeftWidth =
        (pointerSize / 2) + "px";

    pointer.style.borderRightWidth =
        (pointerSize / 2) + "px";

    pointer.style.borderTopWidth =
        pointerSize + "px";
}


/* =========================
   RANGE VALUES
========================= */

document.getElementById("borderWidth")
.addEventListener("input",function(){

    borderWidth = Number(this.value);

    document.getElementById(
        "borderWidthValue"
    ).textContent = t
